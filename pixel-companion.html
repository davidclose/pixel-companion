<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Companion — Whitley Bay</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14202b;
    --panel: #1c2f3d;
    --edge: #0d1a22;
    --cream: #f2e9dc;
    --amber: #f4a259;
    --coral: #e07a5f;
    --sage: #8bab7f;
    --slate: #5b7c99;
    --muted: #7d93a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 20%, #1e3242, #0c151c 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono', monospace;
    color: var(--cream);
    padding: 24px;
  }
  .app{
    width: 100%;
    max-width: 560px;
  }
  .title{
    font-family:'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--amber);
    letter-spacing: 1px;
    margin: 0 0 4px 2px;
  }
  .subtitle{
    font-size: 11px;
    color: var(--muted);
    margin: 0 0 14px 2px;
  }
  .frame{
    background: var(--panel);
    border: 3px solid var(--edge);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
    position: relative;
  }
  canvas{
    width: 100%;
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    display: block;
    border-radius: 4px;
    background: #000;
  }
  .speech{
    position:absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    max-width: 70%;
    background: var(--cream);
    color: #1c2f3d;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 10px;
    border-radius: 6px;
    border: 2px solid var(--edge);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events:none;
  }
  .speech::after{
    content:"";
    position:absolute;
    bottom:-8px; left: 18px;
    border-width: 8px 6px 0 6px;
    border-style: solid;
    border-color: var(--cream) transparent transparent transparent;
  }
  .speech.show{ opacity:1; transform: translateY(0); }

  .status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--edge);
    border-radius: 8px;
    font-size: 12px;
  }
  .status .left{ display:flex; align-items:center; gap:10px; }
  .weather-icon{ font-size: 20px; line-height:1; }
  .loc-pill{
    font-family:'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--sage);
    background: rgba(139,171,127,0.12);
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid rgba(139,171,127,0.3);
    white-space: nowrap;
  }
  .meta{ color: var(--muted); font-size: 11px; text-align:right; }
  .row{ display:flex; gap:10px; margin-top:10px; }
  button{
    flex:1;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: 12px;
    background: var(--slate);
    color: var(--cream);
    border: none;
    padding: 9px 10px;
    border-radius: 6px;
    cursor:pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button:hover{ background: var(--coral); }
  button:active{ transform: scale(0.97); }
  .foot{
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
    text-align:center;
  }
  .chatlog{
    margin-top: 10px;
    max-height: 110px;
    overflow-y: auto;
    background: var(--edge);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chatlog:empty{ display:none; }
  .chatline{ line-height: 1.35; }
  .chatline .who{
    font-family:'Press Start 2P', monospace;
    font-size: 8px;
    margin-right: 6px;
  }
  .chatline.you .who{ color: var(--slate); }
  .chatline.him .who{ color: var(--amber); }
  .chatline.system{ color: var(--muted); font-style: italic; }
  .chatrow{ display:flex; gap:8px; margin-top:10px; }
  .chatrow input[type="text"]{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size: 12px;
    background: var(--edge);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 9px 10px;
  }
  .chatrow input::placeholder{ color: var(--muted); }
  .chatrow button{ flex: 0 0 auto; padding: 9px 14px; }
</style>
</head>
<body>
<div class="app">
  <p class="title">PIXEL COMPANION</p>
  <p class="subtitle">Living quietly in Whitley Bay, weather and all</p>

  <div class="frame">
    <canvas id="scene" width="320" height="240"></canvas>
    <div class="speech" id="speech"></div>
  </div>

  <div class="status">
    <div class="left">
      <span class="weather-icon" id="weatherIcon">🌤️</span>
      <div>
        <div id="weatherText" style="font-weight:700;">Loading weather…</div>
        <div class="meta" id="timeText">—</div>
      </div>
    </div>
    <div class="loc-pill" id="locPill">HOME</div>
  </div>

  <div class="row">
    <button id="nudgeBtn">Nudge him</button>
    <button id="refreshBtn">Refresh weather</button>
  </div>

  <div class="chatlog" id="chatLog"></div>
  <div class="chatrow">
    <input type="text" id="chatInput" placeholder="Say something to him…" maxlength="300">
    <button id="sendBtn">Send</button>
  </div>

  <p class="foot">Weather from Open-Meteo · updates every 30 min · Whitley Bay, UK</p>
</div>

<script>
(function(){
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.scale(2,2); // canvas is 2x logical size for finer detail (outlines, sub-pixel shading); all draw code below still uses the original 160x120 logical coordinate space
  const W = 160, H = 120;
  const OUTLINE = 0.5; // logical-unit outline width — renders as a crisp 1px line at 2x scale

  const PAL = {
    nightSky1: '#0d1826', nightSky2: '#1c2f47',
    daySky1: '#8fd3f4', daySky2: '#c9ecf7',
    duskSky1: '#3c2b4a', duskSky2: '#a85a6b',
    cloudGray: '#6b7d8a', cloudLight: '#8fa0ac',
    sun: '#f4d35e', sunGlow: '#f9e8a0',
    ground: '#5c7a4f', groundDark: '#48603d', groundLight: '#6f9160', groundShade: '#3d5333',
    path: '#c9b48a', pathDark: '#b09b70', pathLine: '#a68a5e',
    houseWall: '#c96f4a', houseWallShade: '#a85838', houseRoof: '#7a3b2e', houseRoofLight: '#8f4a38', doorBrown: '#3b2417',
    cafeWall: '#8a5a44', cafeWallShade: '#6f4634', cafeRoof: '#3e2723', cafeSign: '#e0b13b',
    workWall: '#6b7f8f', workWallShade: '#576a78', workRoof: '#3a4750',
    interiorWarm: '#3a2a2a', interiorWarm2: '#4a3630',
    interiorCafe: '#3d2b22', interiorWork: '#2a3238',
    lampGlow: '#f4a259', window: '#bcd8e8', windowNight:'#1c2f47',
    skin: '#e8b382', skinShade: '#c9925f', blush: '#e0906f',
    hair: '#3a2a1e', hairLight: '#4e3a28',
    shirt: '#8bab7f', shirt2: '#e07a5f', shirtShade: '#6f8f64',
    pants: '#3a4750', pantsShade: '#2c3740', shoe: '#2a2320',
    outline: '#241c16',
    dragonGreen: '#6c9a5a', dragonBelly: '#c9b48a',
    rain: '#a7c7d9', snow: '#ffffff', fog: 'rgba(210,220,225,0.45)',
    star: '#f2e9dc',
    flowerRed: '#d9636b', flowerYellow: '#e8c25a', flowerWhite: '#f2ece0', leafGreen: '#5c8a4a',
    woodLight: '#c9b48a', woodMid: '#8a6a48', woodDark: '#5c4030',
    rugRed: '#a84a3e', rugCream: '#d8c49a',
    smoke: 'rgba(220,220,220,0.5)',
    bookWallExt: '#7a6a4a', bookRoofExt: '#4a3628', bookSign: '#6b4c8a',
    bookWall: '#4a3628', bookFloor: '#2e2018'
  };

  // ---------- state ----------
  const state = {
    weather: { code: 3, temp: 12, isDay: 1, ok: false },
    location: 'home',       // home | outside | cafe | work | bookstore
    transitioning: false,
    animFrame: 0,
    speechTimer: 0,
    tick: 0,
  };

  const LOCATIONS = ['home','outside','cafe','work','bookstore'];

  function mapWeather(code){
    if ([71,73,75,77,85,86].includes(code)) return 'snowy';
    if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'rainy';
    if ([45,48].includes(code)) return 'foggy';
    if ([2,3].includes(code)) return 'cloudy';
    return 'sunny'; // 0,1
  }

  function weatherLabel(w){
    return {sunny:'Sunny', cloudy:'Cloudy', foggy:'Foggy', rainy:'Rainy', snowy:'Snowy'}[w] || 'Clear';
  }
  function weatherIcon(w, isDay){
    if (w==='sunny') return isDay ? '☀️' : '🌙';
    if (w==='cloudy') return isDay ? '⛅' : '☁️';
    if (w==='foggy') return '🌫️';
    if (w==='rainy') return '🌧️';
    if (w==='snowy') return '❄️';
    return '🌤️';
  }

  // ---------- weather fetch ----------
  async function fetchWeather(){
    document.getElementById('weatherText').textContent = 'Checking weather…';
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.0393&longitude=-1.4472&current_weather=true&timezone=Europe/London';
    try{
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const cw = data.current_weather;
      if (!cw) throw new Error('No current_weather in response');
      state.weather = { code: cw.weathercode, temp: Math.round(cw.temperature), isDay: cw.is_day, ok: true };
      state.weather.errorMsg = null;
      updateStatusUI();
      maybeRelocate(true);
    }catch(e){
      console.error('Weather fetch failed:', e);
      state.weather.ok = false;
      state.weather.errorMsg = e.message || String(e);
      updateStatusUI();
    }
  }

  function updateStatusUI(){
    const w = mapWeather(state.weather.code);
    document.getElementById('weatherIcon').textContent = weatherIcon(w, state.weather.isDay);
    document.getElementById('weatherText').textContent = state.weather.ok
      ? `${weatherLabel(w)}, ${state.weather.temp}°C`
      : `Offline (${state.weather.errorMsg || 'unknown error'}) — assuming cloudy`;
    document.getElementById('timeText').textContent = state.weather.isDay ? 'Daytime in Whitley Bay' : 'Night in Whitley Bay';
    document.getElementById('locPill').textContent = state.location.toUpperCase();
  }

  // ---------- behavior ----------
  const SPEECH = {
    home: ['Cosy in here.', "The lizard's asleep already.", "Kettle's on."],
    outside: ['Bit of fresh air.', "Sea's loud today.", 'Nice out, actually.'],
    cafe: ['One flat white, please.', 'Good spot to sit.', "This chair's comfy."],
    work: ['Just tidying a few things up.', 'Nearly done for today.', 'Focus mode.'],
    bookstore: ["Just browsing, honestly.", "Found something good.", "Quiet in here today.", "Smells like old paper in here."],
    rainy: ["Glad I'm not out in that.", 'Listen to that rain.'],
    snowy: ["It's properly coming down.", 'Might build something small.'],
    foggy: ['Can barely see the front gate.'],
    sunny: ['Lovely bit of sun.'],
  };

  function pickSpeech(){
    const w = mapWeather(state.weather.code);
    const pool = [...(SPEECH[state.location]||[]), ...(SPEECH[w]||[])];
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function showSpeech(text){
    const el = document.getElementById('speech');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(state.speechTimer);
    state.speechTimer = setTimeout(()=> el.classList.remove('show'), 4200);
  }

  function preferredLocations(){
    const w = mapWeather(state.weather.code);
    if (!state.weather.isDay) return ['home'];
    if (w === 'rainy' || w === 'snowy') return ['home','cafe','bookstore','home','bookstore'];
    if (w === 'foggy') return ['home','cafe','bookstore'];
    if (w === 'sunny') return ['outside','cafe','work','outside'];
    return ['outside','work','cafe','bookstore','home']; // cloudy
  }

  function maybeRelocate(force){
    if (state.transitioning) return;
    if (!force && Math.random() < 0.45) return; // sometimes he just stays put
    const pool = preferredLocations();
    let next = pool[Math.floor(Math.random()*pool.length)];
    if (next === state.location && !force) return;
    if (next === state.location) return;
    goTo(next);
  }

  function goTo(next){
    state.transitioning = true;
    document.getElementById('locPill').textContent = 'WALKING…';
    setTimeout(()=>{
      state.location = next;
      state.transitioning = false;
      updateStatusUI();
      showSpeech(pickSpeech());
    }, 2600);
  }

  // ---------- drawing helpers ----------
  function rect(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }

  // scattered speckle texture over a region, seeded so it's stable frame-to-frame
  function speckle(x,y,w,h,color,density,seed){
    ctx.fillStyle = color;
    const n = Math.floor((w*h)*density);
    for(let i=0;i<n;i++){
      const sx = x + ((i*37 + seed*13) % w);
      const sy = y + ((i*23 + seed*7) % h);
      ctx.fillRect(sx,sy,1,1);
    }
  }

  function flower(x,y,color){
    rect(x,y,1,1,color); rect(x-1,y+1,1,1,color); rect(x+1,y+1,1,1,color); rect(x,y+2,1,1,color);
    rect(x,y+3,1,2,PAL.leafGreen);
  }

  function twoToneRoof(x,y,w,color,shadow){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x-3,y);
    ctx.lineTo(x+w/2,y-12);
    ctx.lineTo(x+w+3,y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.moveTo(x+w/2,y-12);
    ctx.lineTo(x+w+3,y);
    ctx.lineTo(x+w/2+3,y);
    ctx.closePath();
    ctx.fill();
    // outline the roof silhouette
    ctx.strokeStyle = PAL.outline; ctx.lineWidth = OUTLINE;
    ctx.beginPath();
    ctx.moveTo(x-3,y);
    ctx.lineTo(x+w/2,y-12);
    ctx.lineTo(x+w+3,y);
    ctx.stroke();
  }

  // cross-mullion divider for a window pane, drawn after the window fill/frame
  function paneCross(x,y,w,h){
    ctx.strokeStyle = PAL.outline; ctx.lineWidth = OUTLINE;
    ctx.beginPath();
    ctx.moveTo(x+w/2,y); ctx.lineTo(x+w/2,y+h);
    ctx.moveTo(x,y+h/2); ctx.lineTo(x+w,y+h/2);
    ctx.stroke();
  }

  function skyGradient(x,y,w,h,isDay){
    const g = ctx.createLinearGradient(0,y,0,y+h);
    if (!isDay){ g.addColorStop(0, PAL.nightSky1); g.addColorStop(1, PAL.nightSky2); }
    else { g.addColorStop(0, PAL.daySky1); g.addColorStop(1, PAL.daySky2); }
    ctx.fillStyle = g; ctx.fillRect(x,y,w,h);
  }

  function drawStars(t){
    for(let i=0;i<18;i++){
      const sx = (i*37 + 13) % W;
      const sy = (i*19 + 5) % 55;
      if ((i + Math.floor(t/6)) % 5 === 0) continue;
      rect(sx, sy, 1, 1, PAL.star);
    }
  }

  function drawSun(t){
    const cx = 128, cy = 22;
    ctx.fillStyle = PAL.sunGlow; ctx.beginPath(); ctx.arc(cx,cy,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = PAL.sun; ctx.beginPath(); ctx.arc(cx,cy,6,0,Math.PI*2); ctx.fill();
  }

  function drawClouds(t, dense){
    const offsets = dense ? [0, 40, 90] : [10, 100];
    offsets.forEach((o,i)=>{
      const x = ((t*0.15 + o) % (W+40)) - 20;
      const y = 14 + i*10;
      ctx.fillStyle = PAL.cloudGray;
      rect(x,y,16,4,ctx.fillStyle); rect(x+4,y-3,10,4,ctx.fillStyle); rect(x-4,y+3,20,3,ctx.fillStyle);
    });
  }

  function drawRain(t){
    ctx.strokeStyle = PAL.rain; ctx.lineWidth = 1;
    for(let i=0;i<26;i++){
      const x = (i*13 + (t*4)%160) % W;
      const y = (i*17 + (t*6)) % H;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-2,y+5); ctx.stroke();
    }
  }

  function drawSnow(t){
    for(let i=0;i<22;i++){
      const x = (i*23 + Math.sin((t+i)/8)*6 + 160) % W;
      const y = (i*11 + t*1.4) % H;
      rect(x,y,1,1,PAL.snow);
    }
  }

  function drawFogOverlay(){
    rect(0,0,W,H,PAL.fog);
  }

  // ---- scene backgrounds ----
  function drawTree(x,y,scale){
    scale = scale || 1;
    rect(x-1,y+2*scale,3,11*scale, PAL.woodDark);
    ctx.fillStyle = PAL.groundShade;
    ctx.beginPath(); ctx.arc(x+1,y-2*scale,8*scale,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5c7a4f';
    ctx.beginPath(); ctx.arc(x,y-4*scale,8*scale,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = PAL.groundLight;
    ctx.beginPath(); ctx.arc(x-2,y-6*scale,4*scale,0,Math.PI*2); ctx.fill();
  }

  function drawOutside(t, w, isDay){
    skyGradient(0,0,W,72,isDay);
    if (isDay){
      if (w==='sunny') drawSun(t);
      if (w==='cloudy' || w==='rainy' || w==='snowy' || w==='foggy') drawClouds(t, w!=='cloudy');
      // distant hills for depth
      ctx.fillStyle = 'rgba(92,122,79,0.55)';
      ctx.beginPath(); ctx.arc(20,72,22,Math.PI,0); ctx.fill();
      ctx.beginPath(); ctx.arc(150,72,26,Math.PI,0); ctx.fill();
    } else {
      drawStars(t);
    }
    // ground with grass texture
    rect(0,72,W,H-72, PAL.ground);
    rect(0,72,W,3, PAL.groundDark);
    speckle(0,75,W,H-75, PAL.groundLight, 0.012, 1);
    speckle(0,75,W,H-75, PAL.groundShade, 0.008, 5);
    // little flower patches
    flower(14,86,PAL.flowerYellow); flower(20,90,PAL.flowerWhite);
    flower(92,96,PAL.flowerRed); flower(130,100,PAL.flowerYellow);
    flower(46,108,PAL.flowerWhite); flower(8,104,PAL.flowerRed);

    // path with edge line + texture
    rect(80,75,16,H-75, PAL.path);
    rect(80,75,1,H-75, PAL.pathDark);
    rect(95,75,1,H-75, PAL.pathDark);
    speckle(80,75,16,H-75, PAL.pathLine, 0.02, 3);

    // low fence along the front of the house yard
    for(let i=0;i<5;i++){ rect(6+i*7,71,2,5,'#6f5438'); }
    rect(4,70,34,1,'#6f5438');

    // house (left)
    rect(6,48,34,27, PAL.houseWall);
    rect(6,48,3,27, PAL.houseWallShade);
    twoToneRoof(6,48,34, PAL.houseRoof, PAL.houseRoofLight);
    ctx.strokeStyle=PAL.outline; ctx.lineWidth=OUTLINE; ctx.strokeRect(6,48,34,27);
    // wall plank lines for extra texture
    rect(6,56,34,1,'rgba(0,0,0,0.08)'); rect(6,66,34,1,'rgba(0,0,0,0.08)');
    rect(4,47,2,2,'#3a2a1e'); // chimney
    rect(3,42,4,6,'#5c4a3a');
    ctx.strokeRect(3,42,4,6);
    if (isDay && (w==='sunny' || w==='cloudy')){
      ctx.fillStyle = PAL.smoke;
      const puff = (t*0.3)%20;
      ctx.beginPath(); ctx.arc(5,40-puff*0.6,2+puff*0.08,0,Math.PI*2); ctx.fill();
    }
    rect(18,58,10,17, PAL.doorBrown);
    rect(22,58,1,17,'#2a1810');
    rect(19,64,1,1,'#e0b13b'); // doorknob
    ctx.strokeRect(18,58,10,17);
    rect(10,53,6,6, isDay ? PAL.window : PAL.lampGlow);
    ctx.strokeStyle='#2a2320'; ctx.lineWidth=1; ctx.strokeRect(10,53,6,6);
    paneCross(10,53,6,6);
    rect(24,53,6,6, isDay ? PAL.window : PAL.lampGlow);
    ctx.strokeRect(24,53,6,6);
    paneCross(24,53,6,6);
    // window flower box
    rect(9,59,8,2,'#6f5438');
    flower(11,58,PAL.flowerRed); flower(14,58,PAL.flowerYellow);

    // bookstore (between house and path)
    rect(48,44,28,31, PAL.bookWallExt);
    rect(48,44,3,31, PAL.bookRoofExt);
    twoToneRoof(48,44,28, PAL.bookRoofExt, '#5c4838');
    ctx.strokeStyle=PAL.outline; ctx.lineWidth=OUTLINE; ctx.strokeRect(48,44,28,31);
    rect(48,54,28,1,'rgba(0,0,0,0.08)'); rect(48,64,28,1,'rgba(0,0,0,0.08)');
    rect(57,60,10,15, PAL.doorBrown);
    rect(61,60,1,15,'#2a1810');
    ctx.strokeRect(57,60,10,15);
    rect(51,50,8,8, isDay ? PAL.window : PAL.lampGlow);
    ctx.strokeStyle='#2a2320'; ctx.lineWidth=1; ctx.strokeRect(51,50,8,8);
    paneCross(51,50,8,8);
    rect(50,40,24,5, PAL.bookSign);
    rect(50,40,24,1,'#8a6ba8');
    ctx.strokeStyle=PAL.outline; ctx.lineWidth=OUTLINE; ctx.strokeRect(50,40,24,5);

    // cafe (middle-right)
    rect(102,44,30,31, PAL.cafeWall);
    rect(102,44,3,31, PAL.cafeWallShade);

  function bookshelfWall(x,y,w,h,rows,colorSets){
    rect(x,y,w,h, PAL.woodDark);

    const rowH = h/rows;
    for(let row=0; row<rows; row++){
      const ry = y + row*rowH + 2;
      rect(x+2, ry, w-4, rowH-3, '#1a120c'); // shelf recess
      const colors = colorSets[row%colorSets.length];
      const spineW = 2, gap = 1;
      const n = Math.floor((w-4)/(spineW+gap));
      for(let i=0;i<n;i++){
        rect(x+3+i*(spineW+gap), ry+1, spineW, rowH-5, colors[i%colors.length]);
      }
      rect(x, y+row*rowH, w, 1, '#3a2a1e'); // shelf ledge
    }
  }

  // ---- character ----
  function drawCharacter(x,y,frame,seated,facingLeft){
    ctx.save();
    if (facingLeft){ ctx.translate(x*2,0); ctx.scale(-1,1); x = -x; }
    const bob = seated ? 0 : (frame%2===0 ? 0 : -1);

    // ground shadow (grounding — drawn first, under everything)
    ctx.fillStyle = 'rgba(20,15,10,0.28)';
    ctx.beginPath(); ctx.ellipse(x+6, y+(seated?18:23)+bob, 6,1.4,0,0,Math.PI*2); ctx.fill();

    // legs
    if (!seated){
      rect(x+2,y+14+bob,3,6, PAL.pants);
      rect(x+7,y+14+bob,3,6, PAL.pantsShade);
      rect(x+2,y+20+bob,3,2, PAL.shoe);
      rect(x+7,y+20+bob,3,2, PAL.shoe);
      rect(x+2,y+21+bob,3,1,'#1a1510'); // sole
      rect(x+7,y+21+bob,3,1,'#1a1510');
    } else {
      rect(x+1,y+14,4,4, PAL.pants);
      rect(x+7,y+14,4,4, PAL.pantsShade);
    }
    // belt
    rect(x+1, y+14+bob, 10, 1, PAL.outline);

    // body
    rect(x+1,y+6+bob,10,9, PAL.shirt);
    rect(x+7,y+6+bob,4,9, PAL.shirtShade);
    rect(x+1,y+6+bob,10,2, PAL.shirt2);
    // arms — short sleeve, then bare forearm/hand
    rect(x-1,y+7+bob,2,3, PAL.shirt);
    rect(x-1,y+10+bob,2,3, PAL.skin);
    rect(x+11,y+7+bob,2,3, PAL.shirtShade);
    rect(x+11,y+10+bob,2,3, PAL.skinShade);

    // head
    rect(x+1,y-2+bob,10,9, PAL.skin);
    rect(x+7,y-2+bob,4,9, PAL.skinShade);
    rect(x+1,y-3+bob,10,3, PAL.hair);
    rect(x+6,y-3+bob,5,3, PAL.hairLight);
    rect(x-1,y-3+bob,3,4, PAL.hair);
    rect(x+2,y+4+bob,1,1, PAL.blush);
    rect(x+3,y+1+bob,2,2,'#2a2320');
    rect(x+7,y+1+bob,2,2,'#2a2320');

    // outline pass — grouped silhouettes (head / body+arms / legs), not every sub-rect
    ctx.strokeStyle = PAL.outline; ctx.lineWidth = OUTLINE;
    ctx.strokeRect(x-1, y-3+bob, 12, 10);
    ctx.strokeRect(x-1, y+6+bob, 14, 9);
    if (!seated) ctx.strokeRect(x+2, y+14+bob, 8, 9);
    else ctx.strokeRect(x+1, y+14, 10, 4);

    ctx.restore();
  }

  function drawWalker(t){
    const progress = (t % 26) / 26; // 0..1 across transition window
    const x = 6 + progress * (W-24);
    const y = 78;
    const frame = Math.floor(t/2)%2;
    drawCharacter(x,y,frame,false,false);
  }

  // ---------- main render loop ----------
  function render(){
    const t = state.tick;
    const w = mapWeather(state.weather.code);
    const isDay = !!state.weather.isDay;

    if (state.transitioning){
      drawOutside(t, w, isDay);
      drawWalker(t);
    } else if (state.location === 'home'){
      drawHome(t,w,isDay);
      drawCharacter(48, 84, Math.floor(t/3)%2, false, false);
    } else if (state.location === 'cafe'){
      drawCafe(t,w,isDay);
      drawCharacter(28, 78, 0, true, false);
    } else if (state.location === 'work'){
      drawWork(t,w,isDay);
      drawCharacter(58, 76, 0, true, false);
    } else if (state.location === 'bookstore'){
      drawBookstore(t,w,isDay);
      drawCharacter(78, 76, Math.floor(t/4)%2, false, false);
    } else {
      drawOutside(t,w,isDay);
      drawCharacter(80 + Math.sin(t/10)*4, 78, Math.floor(t/3)%2, false, false);
    }

    state.tick += 1;
  }

  setInterval(render, 180);
  setInterval(()=> maybeRelocate(false), 45000);
  setInterval(fetchWeather, 30*60*1000);

  document.getElementById('nudgeBtn').addEventListener('click', ()=>{
    if (state.transitioning) return;
    const pool = LOCATIONS.filter(l => l !== state.location);
    goTo(pool[Math.floor(Math.random()*pool.length)]);
  });
  document.getElementById('refreshBtn').addEventListener('click', fetchWeather);

      lines: ["See you in a bit.", "Catch you later.", "Night, then."] },
    { keys: ['love','nice','great','cool','awesome','good job','well done'],
      lines: ["Aw, cheers.", "Stop it, you'll make me blush.", "That's kind of you to say."] },
    { keys: ['who are you','what are you','tell me about yourself'],
      lines: ["Just someone living quietly round here, really.", "Not much to tell — home, cafe, work, repeat.", "Ask the lizard, he's known me longer."] },
    { keys: ['bored','tired','sleepy','knackered'],
      lines: ["Same, honestly.", "Might just sit down for a bit.", "Today's been a lot, hasn't it."] },
  ];

  function appendChatLine(who, text){
    const log = document.getElementById('chatLog');
    const line = document.createElement('div');
    line.className = 'chatline ' + who;
    const label = who === 'you' ? 'YOU' : 'HIM';
    line.innerHTML = `<span class="who">${label}</span>${text.replace(/</g,'&lt;')}`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function localReply(text){
    const lower = text.toLowerCase();
    const w = mapWeather(state.weather.code);

    for (const group of CHAT_REPLIES){
      if (!group.keys.some(k => lower.includes(k))) continue;
      if (group.lines === null){
        // weather-related question — answer with the actual current weather
        const wLines = {
          sunny: "It's lovely and sunny out, actually.",
          cloudy: "Bit grey and cloudy today.",
          foggy: "Proper foggy — can barely see the front gate.",
          rainy: "Chucking it down, if you hadn't noticed.",
          snowy: "It's snowing! Might build something small later.",
        };
        return wLines[w] || "Not sure, to be honest — hasn't changed much today.";
      }
      return group.lines[Math.floor(Math.random() * group.lines.length)];
    }
    // no keyword match — fall back to the existing location/weather speech pool
    return pickSpeech();
  }

  const BRIDGE_URL = '/chat'; // relative: same-origin once served by companion-server.js
  state.bridgeAvailable = null; // null = untested, true/false once known

  async function bridgeReply(text){
    const w = mapWeather(state.weather.code);
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), 20000);
    try{
      const res = await fetch(BRIDGE_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          message: text,
          weather: weatherLabel(w).toLowerCase(),
          location: state.location,
          isDay: !!state.weather.isDay,
        }),
        signal: controller.signal,
      });
      if (!res.ok){
        const body = await res.json().catch(()=>({}));
        throw new Error(body?.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      return data.reply || null;
    }finally{
      clearTimeout(timer);
    }
  }

  async function sendChat(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    appendChatLine('you', text);

    // Try the local Claude Code chat bridge first (companion-server.js); if it's
    // not running or errors, fall back to the fully offline keyword replies.
    const wasAvailable = state.bridgeAvailable !== false;
    if (wasAvailable){
      try{
        const reply = await bridgeReply(text);
        if (reply){
          state.bridgeAvailable = true;
          appendChatLine('him', reply);
          showSpeech(reply.length > 70 ? reply.slice(0, 67) + '…' : reply);
          return;
        }
      }catch(e){
        if (wasAvailable){
          appendChatLine('system', "Couldn't reach the local chat bridge — using offline replies. (Run `node companion-server.js` for real AI replies.)");
        }
        state.bridgeAvailable = false;
      }
    }

    const reply = localReply(text);
    setTimeout(()=>{
      appendChatLine('him', reply);
      showSpeech(reply.length > 70 ? reply.slice(0, 67) + '…' : reply);
    }, 300 + Math.random() * 400); // small delay so it doesn't feel instant/robotic
  }

  document.getElementById('sendBtn').addEventListener('click', sendChat);
  document.getElementById('chatInput').addEventListener('keydown', (e)=>{
    if (e.key === 'Enter') sendChat();
  });

  fetchWeather();
  updateStatusUI();
  setTimeout(()=> showSpeech(pickSpeech()), 1500);
})();
</script>
</body>
</html>

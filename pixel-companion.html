<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Companion — Whitley Bay</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14202b;
    --panel: #1c2f3d;
    --edge: #0d1a22;
    --cream: #f2e9dc;
    --amber: #f4a259;
    --coral: #e07a5f;
    --sage: #8bab7f;
    --slate: #5b7c99;
    --muted: #7d93a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 20%, #1e3242, #0c151c 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono', monospace;
    color: var(--cream);
    padding: 24px;
  }
  .app{
    width: 100%;
    max-width: 746px;   /* canvas lands at 720px: 1.5x its 480 pixels, 3x on Retina */
  }
  .title{
    font-family:'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--amber);
    letter-spacing: 1px;
    margin: 0 0 4px 2px;
  }
  .subtitle{
    font-size: 11px;
    color: var(--muted);
    margin: 0 0 14px 2px;
  }
  .frame{
    background: var(--panel);
    border: 3px solid var(--edge);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
    position: relative;
  }
  canvas{
    width: 100%;
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    display: block;
    border-radius: 4px;
    background: #000;
  }
  .speech{
    position:absolute;
    left: 0; top: 0;
    width: max-content;
    max-width: 230px;
    background: var(--cream);
    color: #1c2f3d;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 10px;
    border-radius: 6px;
    border: 2px solid var(--edge);
    opacity: 0;
    transform: translate(-50%, calc(-100% - 12px));
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events:none;
    z-index: 4;
  }
  .speech::after{
    content:"";
    position:absolute;
    bottom:-8px; left: var(--tail, 50%);
    margin-left: -6px;
    border-width: 8px 6px 0 6px;
    border-style: solid;
    border-color: var(--cream) transparent transparent transparent;
  }
  .speech.show{ opacity:1; transform: translate(-50%, calc(-100% - 8px)); }

  /* Hover card for a ship on the sea. */
  .boat-tip{
    position:absolute;
    z-index: 5;
    pointer-events:none;
    opacity: 0;
    transition: opacity 0.12s ease;
    background: var(--cream);
    color: #1c2f3d;
    border: 2px solid var(--edge);
    border-radius: 6px;
    padding: 6px 8px;
    max-width: 210px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45);
    transform: translate(-50%, -100%);
  }
  .boat-tip.show{ opacity: 1; }
  .boat-tip .bt-name{
    font-family:'Press Start 2P', monospace;
    font-size: 8px;
    line-height: 1.5;
    color: #14202b;
    display:block;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .boat-tip .bt-line{
    font-family:'Space Mono', monospace;
    font-size: 10px;
    line-height: 1.45;
    color: #3b5266;
    display:block;
  }
  .boat-tip .bt-note{ color:#8a5a3a; font-style: italic; }
  canvas.boat-hover{ cursor: pointer; }

  .status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--edge);
    border-radius: 8px;
    font-size: 12px;
  }
  .status .left{ display:flex; align-items:center; gap:10px; }
  .weather-icon{ font-size: 20px; line-height:1; }
  .loc-pill{
    font-family:'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--sage);
    background: rgba(139,171,127,0.12);
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid rgba(139,171,127,0.3);
    white-space: nowrap;
  }
  .meta{ color: var(--muted); font-size: 11px; text-align:right; }
  .row{ display:flex; gap:10px; margin-top:10px; }
  button{
    flex:1;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: 12px;
    background: var(--slate);
    color: var(--cream);
    border: none;
    padding: 9px 10px;
    border-radius: 6px;
    cursor:pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button:hover{ background: var(--coral); }
  button:active{ transform: scale(0.97); }
  .foot{
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
    text-align:center;
  }
  .chatlog{
    margin-top: 10px;
    max-height: 110px;
    overflow-y: auto;
    background: var(--edge);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chatlog:empty{ display:none; }
  .chatline{ line-height: 1.35; }
  .chatline .who{
    font-family:'Press Start 2P', monospace;
    font-size: 8px;
    margin-right: 6px;
  }
  .chatline.you .who{ color: var(--slate); }
  .chatline.him .who{ color: var(--amber); }
  .chatline.system{ color: var(--muted); font-style: italic; }
  .chatrow{ display:flex; gap:8px; margin-top:10px; }
  .chatrow input[type="text"]{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size: 12px;
    background: var(--edge);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 9px 10px;
  }
  .chatrow input::placeholder{ color: var(--muted); }
  .chatrow button{ flex: 0 0 auto; padding: 9px 14px; }
</style>
</head>
<body>
<div class="app">
  <p class="title">PIXEL COMPANION</p>
  <p class="subtitle">Living quietly in Whitley Bay, weather and all</p>

  <div class="frame">
    <canvas id="scene" width="480" height="360"></canvas>
    <div class="speech" id="speech"></div>
    <div class="boat-tip" id="boatTip"></div>
  </div>

  <div class="status">
    <div class="left">
      <span class="weather-icon" id="weatherIcon">🌤️</span>
      <div>
        <div id="weatherText" style="font-weight:700;">Loading weather…</div>
        <div class="meta" id="timeText">—</div>
      </div>
    </div>
    <div class="loc-pill" id="locPill">HOME</div>
  </div>

  <div class="row">
    <button id="nudgeBtn">Nudge him</button>
    <button id="refreshBtn">Refresh weather</button>
  </div>

  <div class="chatlog" id="chatLog"></div>
  <div class="chatrow">
    <input type="text" id="chatInput" placeholder="Say something to him…" maxlength="300">
    <button id="sendBtn">Send</button>
  </div>

  <p class="foot">Weather from Open-Meteo · updates every 30 min · Whitley Bay, UK</p>
</div>

<script>
(function(){
  const canvas = document.getElementById('scene');
  let ctx = canvas.getContext('2d');   // let: pointed at offscreen layers while they're built
  ctx.imageSmoothingEnabled = false;
  // Native 320x240 logical space — no scale transform. Every draw call below
  // works in these coordinates directly, which is what gives the art its
  // detail (twice the addressable resolution per axis vs the old 160x120).
  const W = 480, H = 360;

  function shade(hex, amt){
    const c = hex.replace('#','');
    let r = parseInt(c.substring(0,2),16);
    let g = parseInt(c.substring(2,4),16);
    let b = parseInt(c.substring(4,6),16);
    r = Math.max(0,Math.min(255, Math.round(r + 255*amt)));
    g = Math.max(0,Math.min(255, Math.round(g + 255*amt)));
    b = Math.max(0,Math.min(255, Math.round(b + 255*amt)));
    return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  const PAL = {
    nightSky1: '#0d1826', nightSky2: '#1c2f47',
    daySky1: '#8fd3f4', daySky2: '#c9ecf7',
    cloud: '#f4ecda',
    sun: '#f6d365',
    ground: '#5c8a4f', groundDark: '#456b3c', groundLight: '#6f9e5f', groundShade: '#3d5c33',
    path: '#d9c194', pathEdge: '#c2a877',
    houseWall: '#d9895e', houseRoof: '#8a3f30',
    cafeWall: '#96654a', cafeRoof: '#3e2723', cafeSign: '#e8b93b',
    workWall: '#7a8f9e', workRoof: '#3a4750',
    bookWallExt: '#8a7a58', bookRoofExt: '#4a3628', bookSign: '#7c5a9e',
    doorBrown: '#3b2417', windowGlass: '#bcd8e8', lampGlow: '#f4a259',
    interiorWarm: '#3a2a2a', interiorCafe: '#3d2b22', interiorWork: '#2a3238',
    bookWall: '#4a3628',
    floorHome: '#241a16', floorCafe: '#20140e', floorWork: '#1a2024', floorBook: '#2e2018',
    skin: '#e6b285', hair: '#3f2c1e', blush: '#e0836a',
    shirt: '#8bab7f', shirt2: '#e07a5f', pants: '#39516f', shoe: '#241d18',
    dragonGreen: '#6c9a5a', dragonBelly: '#dccb9e',
    woodLight: '#c9b48a', woodMid: '#8a6a48', woodDark: '#5c4030',
    rugRed: '#a84a3e', rugCream: '#d8c49a',
    flowerRed: '#d9636b', flowerYellow: '#e8c25a', flowerWhite: '#f2ece0', leafGreen: '#5c8a4a',
    smoke: 'rgba(220,220,220,0.45)',
    rain: '#a7c7d9', snow: '#ffffff', fog: 'rgba(212,222,228,0.5)',
    star: '#f2e9dc', outline: '#241c16', ink: '#241c16', mouth: '#8a4c3a',
    // beach
    seaDay: '#2f6f96', seaDayFar: '#5fa3c4', seaNight: '#132a3e', seaNightFar: '#24455f',
    seaFoam: '#eaf5f8', sand: '#e2c99f', sandLight: '#eeddb8', sandDark: '#c4a87e',
    sandWet: '#b79a72', pebble: '#9c8a72', headland: '#3d4a44', headlandFar: '#7d9099',
    hullRed: '#a8433a', hullBlue: '#2f4a6b', hullBlack: '#1f1c1a', hullGrey: '#59686b',
    hullWhite: '#e4e0d4', superWhite: '#efeade', boatWindow: '#2b3f52',
    funnelRed: '#c4553f', mast: '#8a7a58', sail: '#f2ece0',
    // promenade
    street: '#cfc3a6', streetLine: '#b8aa89', kerb: '#9b8d72', seaWall: '#b3a996', seaWallDark: '#8f8676', rail: '#e9eef0'
  };

  function rect(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }

  // beveled fill: light top/left edge, dark bottom/right edge — gives flat blocks a rendered feel
  function bevel(x,y,w,h,base,edge){
    edge = edge || 2;
    rect(x,y,w,h,base);
    rect(x,y,w,edge, shade(base,0.16));
    rect(x,y,edge,h, shade(base,0.16));
    rect(x,y+h-edge,w,edge, shade(base,-0.22));
    rect(x+w-edge,y,edge,h, shade(base,-0.22));
  }

  // outlined + beveled block — the core "chunky pixel" building block used everywhere
  function block(x,y,w,h,base,edge){
    rect(x-2,y-2,w+4,h+4, PAL.outline);
    bevel(x,y,w,h,base,edge||2);
  }

  // rounded, shaded blob for organic shapes (sun, foliage, heads)
  function blob(cx,cy,r,base,outline){
    if (outline !== false){
      ctx.fillStyle = PAL.outline;
      ctx.beginPath(); ctx.arc(cx,cy,r+2,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = shade(base,0.18);
    ctx.beginPath(); ctx.arc(cx-r*0.32,cy-r*0.32,r*0.42,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = shade(base,-0.18);
    ctx.beginPath(); ctx.arc(cx+r*0.35,cy+r*0.4,r*0.38,0,Math.PI*2); ctx.fill();
  }

  // scattered 2x2 speckles over a region, seeded so it's stable frame-to-frame
  function speckle(x,y,w,h,color,density,seed){
    ctx.fillStyle = color;
    const n = Math.floor((w*h)*density);
    for(let i=0;i<n;i++){
      const sx = x + ((i*37 + seed*13) % w);
      const sy = y + ((i*23 + seed*7) % h);
      ctx.fillRect(sx,sy,2,2);
    }
  }

  function flower(x,y,color){
    rect(x,y,2,2,color); rect(x-2,y+2,2,2,color); rect(x+2,y+2,2,2,color); rect(x,y+4,2,2,color);
    rect(x,y+6,2,4,PAL.leafGreen);
  }

  // ---------- state ----------
  const state = {
    weather: { code: 3, temp: 12, isDay: 1, ok: false },
    location: 'home',       // home | outside | cafe | work | bookstore | beach
    pos: null,              // where he is in the world, in tiles (set once the world exists)
    walking: false,
    path: [],               // waypoints still to walk
    walkTo: null,           // where he's heading, or null for an idle stroll
    facing: 'front',        // front | back | side, while walking
    flip: false,            // mirrored: facing left
    charBox: null, heroScreen: null,
    animFrame: 0,
    speechTimer: 0,
    tick: 0,
    boats: [],            // vessels currently drawn on the sea
    boatsLive: false,     // true when these are real AIS positions
    boatsAt: Date.now(),  // when they were fetched, for between-update drift
    boatHits: [],         // hover targets, rebuilt every frame by drawShips
    tide: null,           // { norm, rising, metres } once the tide is known
    tideSeries: null,     // hourly sea-level samples we interpolate between
  };

  const LOCATIONS = ['home','outside','cafe','work','bookstore','beach'];

  function mapWeather(code){
    if ([71,73,75,77,85,86].includes(code)) return 'snowy';
    if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'rainy';
    if ([45,48].includes(code)) return 'foggy';
    if ([2,3].includes(code)) return 'cloudy';
    return 'sunny'; // 0,1
  }

  function weatherLabel(w){
    return {sunny:'Sunny', cloudy:'Cloudy', foggy:'Foggy', rainy:'Rainy', snowy:'Snowy'}[w] || 'Clear';
  }
  function weatherIcon(w, isDay){
    if (w==='sunny') return isDay ? '☀️' : '🌙';
    if (w==='cloudy') return isDay ? '⛅' : '☁️';
    if (w==='foggy') return '🌫️';
    if (w==='rainy') return '🌧️';
    if (w==='snowy') return '❄️';
    return '🌤️';
  }

  // ---------- weather fetch ----------
  async function fetchWeather(){
    document.getElementById('weatherText').textContent = 'Checking weather…';
    // GMT, not Europe/London: the daily sunrise/sunset come back as bare
    // timestamps, and a local-time zone would make Date.parse read them in the
    // viewer's own zone. past_days=1 covers the small hours, when the relevant
    // sunset was yesterday's.
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.0393&longitude=-1.4472' +
      '&current_weather=true&daily=sunrise,sunset&past_days=1&forecast_days=2&timezone=GMT';
    try{
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const cw = data.current_weather;
      if (!cw) throw new Error('No current_weather in response');
      state.weather = { code: cw.weathercode, temp: Math.round(cw.temperature), isDay: cw.is_day, ok: true };
      const dl = data.daily;
      if (dl && Array.isArray(dl.sunrise) && Array.isArray(dl.sunset)){
        state.sunTimes = {
          rise: dl.sunrise.map(v => Date.parse(v + 'Z')).filter(Number.isFinite),
          set:  dl.sunset.map(v => Date.parse(v + 'Z')).filter(Number.isFinite),
        };
      }
      state.weather.errorMsg = null;
      updateStatusUI();
      maybeRelocate(true);
    }catch(e){
      console.error('Weather fetch failed:', e);
      state.weather.ok = false;
      state.weather.errorMsg = e.message || String(e);
      updateStatusUI();
    }
  }

  function updateStatusUI(){
    const w = mapWeather(state.weather.code);
    const sky = skyState();
    document.getElementById('weatherIcon').textContent = weatherIcon(w, sky.night < 0.5);
    document.getElementById('weatherText').textContent = state.weather.ok
      ? `${weatherLabel(w)}, ${state.weather.temp}°C`
      : `Offline (${state.weather.errorMsg || 'unknown error'}) — assuming cloudy`;
    const when = { dawn: 'Dawn', dusk: 'Dusk', day: 'Daytime', night: 'Night' }[sky.phase] + ' in Whitley Bay';
    const tw = tideWord();
    document.getElementById('timeText').textContent = tw ? `${when} · ${tw}` : when;
    document.getElementById('locPill').textContent = (state.walking && state.walkTo) ? 'WALKING…' : state.location.toUpperCase();
  }

  // ---------- behavior ----------
  const SPEECH = {
    home: ['Cosy in here.', "The lizard's asleep already.", "Kettle's on."],
    outside: ['Bit of fresh air.', "Sea's loud today.", 'Nice out, actually.'],
    cafe: ['One flat white, please.', 'Good spot to sit.', "This chair's comfy."],
    work: ['Just tidying a few things up.', 'Nearly done for today.', 'Focus mode.'],
    bookstore: ["Just browsing, honestly.", "Found something good.", "Quiet in here today.", "Smells like old paper in here."],
    beach: ["That's the Tyne ferry, that one.", "Could watch the boats all day.", "Sand in my shoes again.", "Something big heading for the Tyne.", "Wind's coming right off the sea."],
    rainy: ["Glad I'm not out in that.", 'Listen to that rain.'],
    snowy: ["It's properly coming down.", 'Might build something small.'],
    foggy: ['Can barely see the front gate.'],
    sunny: ['Lovely bit of sun.'],
    clearNight: ['Clear night out there.', 'Nice and still tonight.'],
  };

  // AIS destinations are terse port codes. Translate the handful that actually
  // come up on this stretch of coast; anything else is just shown as broadcast.
  const PORT_NAMES = {
    'GBTYN': 'the Tyne', 'GBNCL': 'Newcastle', 'GBSSH': 'South Shields',
    'GBBLY': 'Blyth', 'GB TYNE': 'the Tyne', 'TYNE': 'the Tyne',
    'BLYTH/BOWF': 'the Blyth wind farm', 'GBSUN': 'Sunderland',
    'GBHRT': 'Hartlepool', 'NLIJM': 'IJmuiden', 'NLAMS': 'Amsterdam',
    'GBIMM': 'Immingham', 'GBLEI': 'Leith', 'DKESB': 'Esbjerg',
  };
  function portName(code){
    if (!code) return null;
    return PORT_NAMES[code.toUpperCase().trim()] || null;
  }

  // AIS names are broadcast in block capitals, which reads like shouting in a
  // speech bubble.
  function vesselCase(n){
    return n.toLowerCase()
      .replace(/(^|[\s'-])([a-z])/g, (m,a,b) => a + b.toUpperCase())
      // "Pride Of The Tyne" reads oddly; connecting words stay lower unless
      // they start the name.
      .replace(/\b(Of|The|And|An|In|On|At|To|For|Van|Der|Den|De|Du|La|Le)\b/g,
               (m, _w, off) => off === 0 ? m : m.toLowerCase())
      // Plenty of boats are named "SOMETHING II" or "III", and title-casing
      // those to "Ii"/"Iii" looks like a typo. Put the numerals back.
      .replace(/\b(I{1,3}|IV|VI{0,3}|IX|XI{0,2})\b/gi, (m) => m.toUpperCase());
  }

  // The AIS category words are fine as data labels but stilted out loud —
  // nobody standing on a beach says "a passenger vessel".
  const SPOKEN_CATEGORY = {
    cargo: 'cargo ship', tanker: 'tanker', passenger: 'ferry',
    fishing: 'fishing boat', sailing: 'yacht', pleasure: 'little pleasure boat',
    tug: 'tug', service: 'workboat', fast: 'fast craft', military: 'navy boat',
  };

  // An offhand remark about a ship he can actually see. Kept local rather than
  // asking Claude, so the beach still feels alive with no bridge running.
  function boatSpeech(){
    if (state.location !== 'beach' || !state.boatsLive || !state.boats.length) return null;
    const named = state.boats.filter(b => b.name && !/^Vessel /.test(b.name));
    if (!named.length) return null;
    const b = named[Math.floor(Math.random() * Math.min(4, named.length))];
    const nm = vesselCase(b.name);
    const lines = [`That's the ${nm} out there.`];
    if (b.moving && b.speedKts > 6) lines.push(`The ${nm}'s fairly shifting along.`);
    if (!b.moving) lines.push(`The ${nm}'s been sat out there a while.`);
    const kind = SPOKEN_CATEGORY[b.category];
    if (kind) lines.push(`Looks like a ${kind}, that one.`);
    const dest = portName(b.destination);
    if (dest) lines.push(`The ${nm}'s away to ${dest}.`);
    if (b.distanceKm < 4) lines.push(`That one's close in — the ${nm}.`);
    return lines[Math.floor(Math.random() * lines.length)];
  }

  // What the water's actually doing, rather than a fixed line about it.
  function tideSpeech(){
    const td = state.tide;
    if (!td || state.location !== 'beach') return null;
    if (td.norm > 0.86) return ["Tide's right in.", "That's about as far up as it comes."];
    if (td.norm < 0.14) return ["Tide's right out.", 'Loads of sand today.'];
    return td.rising
      ? ["Tide's on its way in.", 'Water keeps creeping up on me.']
      : ["Tide's going back out.", "Sea's on its way out again."];
  }

  // Remarks on the sky itself, outdoors: a sunset, an early start, the moon.
  function skySpeech(){
    if (state.location !== 'outside' && state.location !== 'beach') return null;
    const s = skyState(), w = mapWeather(state.weather.code);
    const clearish = w === 'sunny' || w === 'cloudy';
    if (s.phase === 'dusk' && clearish) return ['Look at that sky.', "Sun's nearly down.", 'Proper sunset, that.'];
    if (s.phase === 'dawn' && clearish) return ['Up with the sun for once.', 'Lovely light this early.'];
    if (s.phase === 'night' && w === 'sunny'){
      const lit = moonLit(moonPhase());
      if (lit > 0.95) return ['Full moon tonight.', 'Bright out, with that moon.'];
      if (lit < 0.05) return ['No moon at all tonight. Look at those stars.'];
    }
    return null;
  }

  function pickSpeech(){
    const sl = skySpeech();
    if (sl && Math.random() < 0.4) return sl[Math.floor(Math.random() * sl.length)];
    if (state.location === 'beach'){
      // On the beach he'd mostly be remarking on a passing ship, sometimes on
      // the water itself.
      if (Math.random() < 0.55){
        const line = boatSpeech();
        if (line) return line;
      }
      const tl = tideSpeech();
      if (tl && Math.random() < 0.5) return tl[Math.floor(Math.random()*tl.length)];
    }
    const w = mapWeather(state.weather.code);
    // Open-Meteo calls a clear night "sunny" too; he shouldn't praise the sun at 10pm.
    const wKey = (w === 'sunny' && !isDaytime()) ? 'clearNight' : w;
    const pool = [...(SPEECH[state.location]||[]), ...(SPEECH[wKey]||[])];
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function showSpeech(text){
    const el = document.getElementById('speech');
    el.textContent = text;
    el.classList.add('show');
    placeSpeech();
    clearTimeout(state.speechTimer);
    state.speechTimer = setTimeout(()=> el.classList.remove('show'), 4200);
  }

  function preferredLocations(){
    const w = mapWeather(state.weather.code);
    if (!isDaytime()) return ['home'];
    if (w === 'rainy' || w === 'snowy') return ['home','cafe','bookstore','home','bookstore'];
    if (w === 'foggy') return ['home','cafe','bookstore'];
    if (w === 'sunny') return ['outside','beach','cafe','beach','work','outside'];
    return ['outside','work','beach','cafe','bookstore','home']; // cloudy
  }

  function maybeRelocate(force){
    if (state.walking) return;
    if (!force && Math.random() < 0.45) return; // sometimes he just stays put
    const pool = preferredLocations();
    const next = pool[Math.floor(Math.random()*pool.length)];
    if (next === state.location) return;
    goTo(next);
  }

  // He actually walks there now: back out to the promenade the way he came
  // (through the door, or up the beach steps), along it, and in.
  function goTo(next){
    if (!next || (state.walking && state.walkTo)) return;   // already on his way somewhere
    if (next === state.location && !state.walking) return;
    const out = routeTo(state.location).slice(0, -1).reverse();
    startWalk([...out, ...routeTo(next)], next);
  }

  // ---------- tide ----------
  // Open-Meteo's marine endpoint gives sea level including tides, with no API
  // key — so unlike the boats, this works in every mode, including the plain
  // double-clicked HTML file. Times are requested in GMT and parsed with an
  // explicit 'Z' so the reading doesn't shift with the viewer's own timezone.
  const TIDE_URL = 'https://marine-api.open-meteo.com/v1/marine' +
    '?latitude=55.0393&longitude=-1.4472&hourly=sea_level_height_msl' +
    '&timezone=GMT&forecast_days=3';

  async function fetchTide(){
    try {
      const res = await fetch(TIDE_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      const times = d.hourly && d.hourly.time;
      const vals = d.hourly && d.hourly.sea_level_height_msl;
      if (!times || !vals) throw new Error('no sea level data');
      const series = [];
      for (let i = 0; i < times.length; i++){
        if (typeof vals[i] === 'number') series.push({ t: Date.parse(times[i] + 'Z'), v: vals[i] });
      }
      if (series.length < 3) throw new Error('not enough samples');
      state.tideSeries = series;
      updateTide();
    } catch (e) {
      console.error('Tide fetch failed:', e);
      state.tideSeries = null;
      state.tide = null;
      updateStatusUI();
    }
  }

  // Interpolate between the hourly samples so the water moves continuously
  // rather than stepping once an hour.
  function sampleTide(at){
    const s = state.tideSeries;
    if (!s || s.length < 2) return null;
    if (at <= s[0].t) return s[0].v;
    if (at >= s[s.length-1].t) return s[s.length-1].v;
    for (let i = 1; i < s.length; i++){
      if (at <= s[i].t){
        const a = s[i-1], b = s[i];
        const f = (at - a.t) / (b.t - a.t);
        return a.v + (b.v - a.v) * f;
      }
    }
    return null;
  }

  function updateTide(){
    const now = Date.now();
    const v = sampleTide(now);
    if (v === null){ state.tide = null; updateStatusUI(); return; }
    // Normalise against the whole forecast window, so "high" and "low" mean
    // high and low for this stretch of tides rather than for one day.
    let lo = Infinity, hi = -Infinity;
    for (const p of state.tideSeries){ if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; }
    const span = (hi - lo) || 1;
    const ahead = sampleTide(now + 20*60*1000);
    state.tide = {
      metres: v,
      norm: Math.max(0, Math.min(1, (v - lo) / span)),
      rising: ahead !== null ? ahead > v : true,
    };
    updateStatusUI();
  }

  function tideWord(){
    const td = state.tide;
    if (!td) return null;
    if (td.norm > 0.86) return 'high tide';
    if (td.norm < 0.14) return 'low tide';
    return td.rising ? 'tide coming in' : 'tide going out';
  }

  // ---------- boats ----------
  // Real vessel positions come from GET /boats, which companion-server.js
  // feeds from live AIS. Opened as a bare file:// page (or with no aisstream
  // key set up) there's no server to ask, so the sea falls back to a fixed
  // set of stand-ins — same graceful degradation as chat's canned replies.
  // They're flagged as examples so the hover card never passes them off as real.
  const EXAMPLE_BOATS = [
    { name:'Example cargo ship', category:'cargo',     distanceKm: 6.5, bearing: 78,  speedKts: 9,   course: 200, example:true },
    { name:'Example ferry',      category:'passenger', distanceKm: 11,  bearing: 120, speedKts: 14,  course: 20,  example:true },
    { name:'Example tug',        category:'tug',       distanceKm: 4,   bearing: 160, speedKts: 3,   course: 190, example:true },
    { name:'Example fishing boat', category:'fishing', distanceKm: 2.5, bearing: 100, speedKts: 1.5, course: 40,  example:true },
    { name:'Example yacht',      category:'sailing',   distanceKm: 16,  bearing: 55,  speedKts: 5,   course: 150, example:true },
  ];

  function useExampleBoats(){
    state.boats = EXAMPLE_BOATS;
    state.boatsLive = false;
    state.boatsAt = Date.now();
  }

  async function fetchBoats(){
    try {
      const res = await fetch('/boats', { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      if (data && data.ok && Array.isArray(data.boats) && data.boats.length){
        state.boats = data.boats;
        state.boatsLive = true;
        state.boatsAt = Date.now();
        return;
      }
      useExampleBoats();
    } catch {
      useExampleBoats();
    }
  }

  // ---------- time of day ----------
  // Day and night used to be a switch: Open-Meteo's is_day, refreshed every
  // 30 minutes, flipped the whole scene at once and could lag sunset by up
  // to half an hour. Now everything runs from the clock against the real
  // sunrise and sunset, so the light fades through dusk and dawn.
  //   night: 0 full day .. 1 full night
  //   glow:  how strongly the sky is sunrise/sunset coloured (peaks at the event)
  //   lift:  sun height, 0 on the horizon .. 1 its usual place
  const MIN = 60 * 1000;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  function skyState(now = Date.now()){
    const st = state.sunTimes;
    if (!st || !(st.rise.length + st.set.length)){
      const n = state.weather.isDay ? 0 : 1;        // no sun times yet: old behaviour
      return { night: n, glow: 0, lift: 1 - n, phase: n ? 'night' : 'day', event: null, sinceEvent: 0 };
    }
    let best = null;
    for (const t of st.rise) if (!best || Math.abs(now - t) < Math.abs(now - best.t)) best = { t, kind: 'rise' };
    for (const t of st.set)  if (!best || Math.abs(now - t) < Math.abs(now - best.t)) best = { t, kind: 'set' };
    const d = now - best.t;                           // negative before the event
    let night, lift;
    if (best.kind === 'set'){
      night = clamp01((d + 15*MIN) / (60*MIN));       // darkening from 15 min before to 45 after
      lift  = clamp01(-d / (70*MIN));
    } else {
      night = clamp01(1 - (d + 45*MIN) / (60*MIN));   // lightening from 45 min before to 15 after
      lift  = clamp01(d / (70*MIN));
    }
    const glow = clamp01(1 - Math.abs(d) / (55*MIN));
    const phase = glow > 0.35 ? (best.kind === 'set' ? 'dusk' : 'dawn') : (night >= 0.5 ? 'night' : 'day');
    return { night, glow, lift, phase, event: best.kind, sinceEvent: d };
  }

  // What the current frame is drawn with; set once at the top of render().
  let curSky = skyState();
  const isDaytime = () => skyState().night < 0.5;
  // Lamps, windows and ships' lights come on part-way into dusk.
  const lampsOn = () => curSky.night > 0.25;

  // Moon phase from the mean synodic month, counted from a known new moon.
  // Checked against five eclipse dates: within about 16 hours every time,
  // well under a pixel's difference at this size. 0 new, 0.5 full.
  const SYNODIC_DAYS = 29.530588853;
  const KNOWN_NEW_MOON = Date.UTC(2000, 0, 6, 18, 14);
  function moonPhase(now = Date.now()){
    return (((now - KNOWN_NEW_MOON) / 86400000 / SYNODIC_DAYS) % 1 + 1) % 1;
  }
  const moonLit = (p) => (1 - Math.cos(2 * Math.PI * p)) / 2;   // fraction illuminated
  function moonName(p){
    if (p < 0.03 || p > 0.97) return 'new moon';
    if (p < 0.22) return 'waxing crescent';
    if (p < 0.28) return 'first quarter moon';
    if (p < 0.47) return 'waxing gibbous moon';
    if (p < 0.53) return 'full moon';
    if (p < 0.72) return 'waning gibbous moon';
    if (p < 0.78) return 'last quarter moon';
    return 'waning crescent';
  }

  function mix(a, b, t){
    t = clamp01(t);
    const pa = [1,3,5].map(i => parseInt(a.substr(i,2),16));
    const pb = [1,3,5].map(i => parseInt(b.substr(i,2),16));
    return '#' + pa.map((v,i) => Math.round(v + (pb[i]-v)*t).toString(16).padStart(2,'0')).join('');
  }

  // ---------- drawing helpers ----------
  function skyGradient(x,y,w,h){
    const s = curSky;
    const g = ctx.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0, PAL.daySky1); g.addColorStop(1, PAL.daySky2);
    ctx.fillStyle = g; ctx.fillRect(x,y,w,h);
    if (s.night > 0){
      const n = ctx.createLinearGradient(0,y,0,y+h);
      n.addColorStop(0, PAL.nightSky1); n.addColorStop(1, PAL.nightSky2);
      ctx.globalAlpha = s.night; ctx.fillStyle = n; ctx.fillRect(x,y,w,h);
    }
    if (s.glow > 0){
      const d = ctx.createLinearGradient(0,y,0,y+h);
      d.addColorStop(0,    'rgba(110,80,160,0)');
      d.addColorStop(0.45, 'rgba(206,112,150,0.45)');
      d.addColorStop(1,    'rgba(255,164,92,0.85)');
      ctx.globalAlpha = s.glow * (1 - s.night * 0.6);   // fades as it gets properly dark
      ctx.fillStyle = d; ctx.fillRect(x,y,w,h);
    }
    ctx.globalAlpha = 1;
  }

  function drawStars(t, alpha){
    ctx.globalAlpha = alpha;
    for(let i=0;i<28;i++){
      const sx = (i*61 + 23) % W;
      const sy = (i*37 + 9) % 110;
      if ((i + Math.floor(t/6)) % 5 === 0) continue;
      rect(sx, sy, 2, 2, PAL.star);
    }
    ctx.globalAlpha = 1;
  }

  // You're looking west, from the sea back at the town, so the sun sets behind
  // the rooms: it sinks out of sight behind them and the skyline. At dawn it's
  // rising behind you, so instead it fades into its daytime place as the
  // morning goes on.
  const SUN_X = 330, SUN_TOP = 40;
  function drawSun(horizonY){
    const s = curSky;
    if (s.event === 'set' && s.sinceEvent > 3*MIN) return;   // gone down
    const morning = s.event === 'rise';
    const alpha = morning ? s.lift : 1;
    if (alpha <= 0.02) return;
    const lift = morning ? 1 : s.lift;
    const y = Math.round(horizonY - 4 - lift * (horizonY - 4 - SUN_TOP));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.rect(0, 0, W, horizonY); ctx.clip();
    blob(SUN_X, y, 18, mix(PAL.sun, '#ff7b3a', s.glow * 0.9));
    ctx.restore();
  }

  // Pixel moon in its real phase: each row lit from the terminator to the
  // limb, the dark side faintly visible, a few craters on the lit part.
  const MOON_X = 412, MOON_Y = 30, MOON_R = 9;
  function drawMoon(p){
    const k = Math.cos(2 * Math.PI * p), waxing = p < 0.5;
    const craters = [[-3,-2],[2,3],[3,-4],[-1,4],[-4,2]];
    for (let yy = -MOON_R; yy < MOON_R; yy++){
      const hw = Math.sqrt(MOON_R*MOON_R - (yy+0.5)*(yy+0.5));
      const x0 = Math.round(MOON_X - hw), x1 = Math.round(MOON_X + hw);
      rect(x0, MOON_Y + yy, x1 - x0, 1, '#2d3548');
      const l0 = waxing ? Math.round(MOON_X + k*hw) : x0;
      const l1 = waxing ? x1 : Math.round(MOON_X - k*hw);
      if (l1 > l0){
        rect(l0, MOON_Y + yy, l1 - l0, 1, '#f1ecd6');
        for (const [cx, cy] of craters){
          const px = MOON_X + cx;
          if (cy === yy && px >= l0 && px < l1) rect(px, MOON_Y + yy, 2, 1, '#d4ccb0');
        }
      }
    }
  }

  // Set each frame: rain clouds are grey, not the white of a fair-weather day.
  let curWeather = 'cloudy';
  function cloudColour(){
    const base = curWeather === 'rainy' ? '#a3adb6' : curWeather === 'snowy' ? '#d9dee4' : curWeather === 'foggy' ? '#c8cfd4' : PAL.cloud;
    const c = mix(base, '#4a5468', curSky.night);        // slate grey at night
    return mix(c, '#f3a58e', curSky.glow * 0.55 * (1 - curSky.night * 0.5));
  }

  function drawClouds(t, dense){
    const col = cloudColour();
    const offsets = dense ? [0, 80, 180] : [20, 200];
    offsets.forEach((o,i)=>{
      const x = ((t*0.3 + o) % (W+80)) - 40;
      const y = 28 + i*20;
      blob(x, y, 10, col, false);
      blob(x+16, y-4, 8, col, false);
      blob(x-14, y+4, 9, col, false);
    });
  }

  // Everything in the sky, for any time of day. Stars and moon only where the
  // sky is actually clear: a rainy night used to show a sky full of stars.
  function drawSkyDetails(t, w, horizonY){
    const s = curSky, clear = w === 'sunny', cloudy = w === 'cloudy';
    const starA = s.night * (clear ? 1 : cloudy ? 0.35 : 0);
    if (starA > 0.03) drawStars(t, starA);
    const p = moonPhase();
    if (s.night > 0.15 && moonLit(p) > 0.03 && (clear || cloudy)){
      drawMoon(p);                                   // behind any clouds
      if (clear && lampsOn()) addLight(MOON_X, MOON_Y, 30, '200,215,255', 0.18 * moonLit(p), () => drawMoon(p));
    }
    if (clear && s.night < 0.6) drawSun(horizonY);
    if (!clear) drawClouds(t, !cloudy);
  }

  // ---------- the isometric town ----------
  // One diorama: four open-fronted rooms side by side along a seafront
  // promenade, the beach below the sea wall, and the sea in front. You're
  // looking west from the water back at Whitley Bay, so north is on your right
  // (St Mary's lighthouse) and south, toward the Tyne, on your left.
  //
  // World units are floor tiles (x runs down-right on screen, y down-left);
  // z is height in screen pixels. The whole world sits on one iso grid, so
  // every object, and him, shares the same projection and depth order.
  const TW = 16, TH = 8;                        // a tile is 16x8 on screen (2:1)
  const OX = 96, OY = 122;                      // where world (0,0) lands on screen
  const iso = (x, y, z = 0) => [OX + (x - y) * (TW / 2), OY + (x + y) * (TH / 2) - z];
  const rowY = (s) => OY + s * (TH / 2);        // screen y of the row where x+y = s
  const atRow = (s, d, z = 0) => ({ x: (s + d) / 2, y: (s - d) / 2, z });   // from x+y and x-y

  // Crisp convex polygon fill. Canvas paths antialias their edges, which
  // smears the stair-stepped 2:1 lines iso pixel art depends on, so polygons
  // are filled row by row with whole pixels instead.
  function fillPolyOn(c, pts, color){
    let minY = Infinity, maxY = -Infinity;
    for (const p of pts){ if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
    c.fillStyle = color;
    for (let yy = Math.ceil(minY - 0.5); yy <= Math.floor(maxY - 0.5); yy++){
      const yc = yy + 0.5;
      let lo = Infinity, hi = -Infinity;
      for (let i = 0, n = pts.length; i < n; i++){
        const a = pts[i], b = pts[(i + 1) % n];
        if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)){
          const x = a[0] + (yc - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
          if (x < lo) lo = x;
          if (x > hi) hi = x;
        }
      }
      const xa = Math.round(lo), xb = Math.round(hi);
      if (xb > xa) c.fillRect(xa, yy, xb - xa, 1);
    }
  }
  const fillPoly = (pts, color) => fillPolyOn(ctx, pts, color);

  function pointInPoly(px, py, pts){
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++){
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  // An axis-aligned box: its top, the +y face (lit, facing down-left) and the
  // +x face (in shade, facing down-right), with a dark outline around the lot.
  function isoBox(x, y, z, w, d, h, base, o = {}){
    if (o.outline !== false){
      const sil = [iso(x, y, z + h), iso(x + w, y, z + h), iso(x + w, y, z), iso(x + w, y + d, z), iso(x, y + d, z), iso(x, y + d, z + h)];
      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) fillPoly(sil.map(p => [p[0] + dx, p[1] + dy]), PAL.outline);
    }
    fillPoly([iso(x, y + d, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], o.left || base);
    fillPoly([iso(x + w, y, z), iso(x + w, y + d, z), iso(x + w, y + d, z + h), iso(x + w, y, z + h)], o.right || shade(base, -0.14));
    fillPoly([iso(x, y, z + h), iso(x + w, y, z + h), iso(x + w, y + d, z + h), iso(x, y + d, z + h)], o.top || shade(base, 0.10));
  }

  // --- layout ---
  // Rooms are square, A tiles a side, each one A further along x and A further
  // back along y than the last. That staggers them into a straight row across
  // the screen and, crucially, means no room's walls hide any of its
  // neighbour: adjacent rooms only touch at a corner.
  const A = 6, WALL = 44, STUB = 7, T = 0.3;    // room size; back and front wall heights; wall thickness
  const DOOR0 = 2.3, DOOR1 = 3.7;               // doorway in each room's front-right wall
  const LANE = 14;                              // the promenade walkway, as x+y
  const PROM_EDGE = 20;                         // the sea wall
  const BEACH_DROP = 8;                         // the sand is this far below the promenade
  const HIGH_WATER_S = 28;                      // high-water mark, as x+y
  const SKY_LINE = rowY(6);                     // where the town's ground meets the sky

  const ROOM_STYLE = {
    home:      { wall: '#e2b48f', floor: '#a2714a', floorKind: 'planks',  ext: '#a65a45', cap: '#7a3f30', spot: [4.05, 4.85], seat: 5, pose: 'front' },
    bookstore: { wall: '#7e9a78', floor: '#7a5234', floorKind: 'planks',  ext: '#6b5a45', cap: '#4a3628', spot: [4.6, 4.5],   seat: 0, pose: 'front' },
    cafe:      { wall: '#efdcb6', floor: '#efe6d4', floor2: '#4a4040', floorKind: 'checker', ext: '#8a5a44', cap: '#3e2723', spot: [4.1, 4.3], seat: 6, pose: 'front' },
    work:      { wall: '#a9b8c4', floor: '#5f6b77', floorKind: 'carpet',  ext: '#6c7a86', cap: '#3a4750', spot: [2.35, 3.05], seat: 6, pose: 'back' },
  };

  function roomOutline(ox, oy){
    const X = ox + A, Y = oy + A;
    return [iso(ox - T, Y, 0), iso(ox - T, Y, WALL), iso(ox - T, oy - T, WALL), iso(X, oy - T, WALL), iso(X, oy - T, 0), iso(X, Y, 0)];
  }

  const ROOMS = ['home', 'bookstore', 'cafe', 'work'].map((id, i) => {
    const ox = A * i, oy = -A * i, st = ROOM_STYLE[id];
    const P = (lx, ly, z = 0) => ({ x: ox + lx, y: oy + ly, z });
    const doorOut = P(A + 0.9, 3);
    return {
      id, i, ox, oy, ...st,
      spot: P(st.spot[0], st.spot[1]),
      doorIn: P(A - 0.7, 3), doorOut,
      lane: atRow(LANE, doorOut.x - doorOut.y),
      silhouette: roomOutline(ox, oy),
    };
  });
  const ROOM_BY_ID = Object.fromEntries(ROOMS.map(r => [r.id, r]));
  const roomAt = (p) => ROOMS.find(r => p.x > r.ox && p.x < r.ox + A && p.y > r.oy && p.y < r.oy + A) || null;

  // The two outdoor places. The bench sits in the gap between the bookshop and
  // the café; the steps down to the sand are straight below it.
  const BENCH = { x: 14.2, y: -3.8 };
  const PLACES = {
    outside: { lane: atRow(LANE, 18), via: [], spot: { x: 14.2, y: -3.55, z: 0 }, seat: 5, pose: 'front' },
    beach:   { lane: atRow(LANE, 18), via: [atRow(19.4, 18, 0), atRow(21.4, 18, -BEACH_DROP)], spot: atRow(24, 18, -BEACH_DROP), seat: 0, pose: 'front' },
  };
  const placeInfo = (loc) => ROOM_BY_ID[loc] || PLACES[loc];

  // lane entry -> ... -> where he settles
  function routeTo(loc){
    const r = ROOM_BY_ID[loc];
    if (r) return [r.lane, r.doorOut, r.doorIn, r.spot];
    const p = PLACES[loc];
    return [p.lane, ...p.via, p.spot];
  }

  const LAMPS = [atRow(9, 6), atRow(9, 30)];

  // --- walls ---
  const onR = (r, u, v) => iso(r.ox + u, r.oy, v);   // back-right wall (y = oy), u along x
  const onL = (r, u, v) => iso(r.ox, r.oy + u, v);   // back-left wall (x = ox), u along y
  const wallQuad = (on, r, u, v, w, h) => [on(r, u, v), on(r, u + w, v), on(r, u + w, v + h), on(r, u, v + h)];
  function wallPanel(on, r, u, v, w, h, color, border){
    if (border) fillPoly(wallQuad(on, r, u - 0.15, v - 1, w + 0.3, h + 2), border);
    fillPoly(wallQuad(on, r, u, v, w, h), color);
  }

  // Window panes are left transparent in the static layer; the live sky (and
  // any rain or snow) is painted behind them every frame.
  const WINDOW_PANES = [];
  function wallWindow(on, r, u, v, w, h){
    fillPoly(wallQuad(on, r, u - 0.2, v - 2, w + 0.4, h + 4), PAL.outline);
    fillPoly(wallQuad(on, r, u - 0.14, v - 1, w + 0.28, h + 2), '#f2ece0');
    fillPoly(wallQuad(on, r, u - 0.25, v - 3, w + 0.5, 2), '#d8d0c0');   // sill
    const pane = wallQuad(on, r, u, v, w, h);
    const xs = pane.map(p => p[0]), ys = pane.map(p => p[1]);
    const bx = Math.floor(Math.min(...xs)), by = Math.floor(Math.min(...ys));
    WINDOW_PANES.push({ pane, on, r, u, v, w, h,
      bbox: [bx, by, Math.ceil(Math.max(...xs)) - bx, Math.ceil(Math.max(...ys)) - by] });
  }
  function drawMullions(p){
    fillPoly(wallQuad(p.on, p.r, p.u + p.w / 2 - 0.09, p.v, 0.18, p.h), '#f2ece0');
    fillPoly(wallQuad(p.on, p.r, p.u, p.v + p.h / 2 - 0.5, p.w, 1), '#f2ece0');
  }

  function drawRoomShell(r){
    const { ox, oy } = r, X = ox + A, Y = oy + A;
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) fillPoly(r.silhouette.map(p => [p[0] + dx, p[1] + dy]), PAL.outline);

    // floor
    fillPoly([iso(ox, oy), iso(X, oy), iso(X, Y), iso(ox, Y)], r.floor);
    if (r.floorKind === 'checker'){
      for (let i = 0; i < A; i++) for (let j = 0; j < A; j++){
        if ((i + j) % 2) fillPoly([iso(ox + i, oy + j), iso(ox + i + 1, oy + j), iso(ox + i + 1, oy + j + 1), iso(ox + i, oy + j + 1)], r.floor2);
      }
    } else if (r.floorKind === 'planks'){
      for (let j = 0; j < A * 2; j++){
        const c = j % 3 === 0 ? shade(r.floor, 0.05) : j % 3 === 1 ? r.floor : shade(r.floor, -0.05);
        fillPoly([iso(ox, oy + j / 2), iso(X, oy + j / 2), iso(X, oy + (j + 1) / 2), iso(ox, oy + (j + 1) / 2)], c);
        const k = ((j * 7) % 5) + 0.5;                  // a board end, staggered row to row
        fillPoly([iso(ox + k, oy + j / 2), iso(ox + k + 0.12, oy + j / 2), iso(ox + k + 0.12, oy + (j + 1) / 2), iso(ox + k, oy + (j + 1) / 2)], shade(r.floor, -0.14));
      }
    } else {
      for (let i = 0; i < 90; i++){
        const [px, py] = iso(ox + ((i * 37) % 59) / 10, oy + ((i * 23) % 59) / 10);
        rect(Math.round(px), Math.round(py), 1, 1, shade(r.floor, i % 2 ? 0.06 : -0.06));
      }
    }

    // back walls: the left one faces +x, into shade; the right one faces +y, into the light
    const wl = shade(r.wall, -0.10);
    fillPoly([iso(ox, oy, 0), iso(ox, Y, 0), iso(ox, Y, WALL), iso(ox, oy, WALL)], wl);
    fillPoly([iso(ox, oy, 0), iso(X, oy, 0), iso(X, oy, WALL), iso(ox, oy, WALL)], r.wall);
    fillPoly([iso(ox, oy, 0), iso(ox, Y, 0), iso(ox, Y, 3), iso(ox, oy, 3)], shade(wl, -0.25));          // skirting
    fillPoly([iso(ox, oy, 0), iso(X, oy, 0), iso(X, oy, 3), iso(ox, oy, 3)], shade(r.wall, -0.25));
    const [cx, cy] = iso(ox, oy, 0);
    rect(Math.round(cx), Math.round(cy - WALL), 1, WALL, shade(wl, -0.18));                          // the corner

    // wall tops, and the brick ends where the walls stop
    fillPoly([iso(ox - T, oy - T, WALL), iso(X, oy - T, WALL), iso(X, oy, WALL), iso(ox, oy, WALL)], r.cap);
    fillPoly([iso(ox - T, oy - T, WALL), iso(ox, oy, WALL), iso(ox, Y, WALL), iso(ox - T, Y, WALL)], r.cap);
    fillPoly([iso(X, oy - T, 0), iso(X, oy, 0), iso(X, oy, WALL), iso(X, oy - T, WALL)], shade(r.ext, -0.14));
    fillPoly([iso(ox - T, Y, 0), iso(ox, Y, 0), iso(ox, Y, WALL), iso(ox - T, Y, WALL)], r.ext);
  }

  // Low front walls, the dollhouse cut. Kept in their own layer per room as
  // well as the static one: when he's inside a room they're drawn again on
  // top of him, since they're between him and you.
  function drawStubs(r){
    const { ox, oy } = r, X = ox + A, Y = oy + A;
    isoBox(ox, Y - T, 0, A, T, STUB, r.ext);                              // front-left
    isoBox(X - T, oy, 0, T, DOOR0, STUB, r.ext);                          // front-right, either side of the door
    isoBox(X - T, oy + DOOR1, 0, T, A - DOOR1, STUB, r.ext);
    const [mx, my] = iso(X + 0.55, oy + (DOOR0 + DOOR1) / 2);             // doormat
    rect(Math.round(mx) - 5, Math.round(my) - 1, 10, 3, '#8a6a48');
  }

  // --- furniture ---
  function spines(face, fixed, a0, a1, z, h, seed){
    const cols = ['#a84a3e', '#4a7ba6', '#e0b13b', '#5c8a4a', '#8a5a44', '#7c5a9e', '#d98a4a', '#3f6b6b', '#e8dcc0'];
    let a = a0, i = seed;
    while (a < a1 - 0.12){
      const wd = 0.22 + ((i * 7) % 3) * 0.06, hh = h - ((i * 5) % 3);
      const q = face === 'x'
        ? [iso(fixed, a, z), iso(fixed, a + wd, z), iso(fixed, a + wd, z + hh), iso(fixed, a, z + hh)]
        : [iso(a, fixed, z), iso(a + wd, fixed, z), iso(a + wd, fixed, z + hh), iso(a, fixed, z + hh)];
      fillPoly(q, cols[i % cols.length]);
      a += wd + 0.05; i++;
    }
  }

  // A bookcase against a back wall, open to the room and full of books.
  function bookcase(r, along, a0, a1, depth, h, rows, seed){
    const wood = '#6b4a30', inner = (h - 5) / rows;
    if (along === 'y'){
      isoBox(r.ox, r.oy + a0, 0, depth, a1 - a0, h, wood);
      const fx = r.ox + depth;
      for (let k = 0; k < rows; k++){
        const z0 = 3 + k * inner, zh = inner - 2;
        fillPoly([iso(fx, r.oy + a0 + 0.15, z0), iso(fx, r.oy + a1 - 0.15, z0), iso(fx, r.oy + a1 - 0.15, z0 + zh), iso(fx, r.oy + a0 + 0.15, z0 + zh)], '#2a1c14');
        spines('x', fx, r.oy + a0 + 0.2, r.oy + a1 - 0.2, z0, zh, seed + k * 5);
      }
    } else {
      isoBox(r.ox + a0, r.oy, 0, a1 - a0, depth, h, wood);
      const fy = r.oy + depth;
      for (let k = 0; k < rows; k++){
        const z0 = 3 + k * inner, zh = inner - 2;
        fillPoly([iso(r.ox + a0 + 0.15, fy, z0), iso(r.ox + a1 - 0.15, fy, z0), iso(r.ox + a1 - 0.15, fy, z0 + zh), iso(r.ox + a0 + 0.15, fy, z0 + zh)], '#2a1c14');
        spines('y', fy, r.ox + a0 + 0.2, r.ox + a1 - 0.2, z0, zh, seed + k * 5);
      }
    }
  }

  function pile(r, lx, ly, z, heights){
    const cols = ['#a84a3e', '#4a7ba6', '#e0b13b', '#5c8a4a', '#7c5a9e', '#8a5a44'];
    let zz = z;
    heights.forEach((h, k) => {
      const inset = (k % 2) * 0.07;
      isoBox(r.ox + lx + inset, r.oy + ly + inset, zz, 0.6, 0.45, h, cols[(k + Math.round(lx * 3)) % cols.length]);
      zz += h;
    });
  }

  function foliage(x, y, z, rad){
    const [sx, sy] = iso(x, y, z);
    blob(Math.round(sx), Math.round(sy - rad + 2), rad, PAL.leafGreen);
  }

  }

  function furnishBookstore(r){
    const B = (lx, ly, z, w, d, h, c, o) => isoBox(r.ox + lx, r.oy + ly, z, w, d, h, c, o);

  // --- outdoors ---
  function lampPost(p, lit){
    isoBox(p.x - 0.1, p.y - 0.1, 0, 0.2, 0.2, 30, '#2a3238');
    isoBox(p.x - 0.28, p.y - 0.28, 30, 0.56, 0.56, 6, lit ? '#ffd88a' : '#8a9aa6', { outline: !lit });

  function drawBench(){
    const { x, y } = BENCH;
    isoBox(x - 1.0, y - 0.25, 0, 0.12, 0.5, 4, '#3a3530'); isoBox(x + 0.88, y - 0.25, 0, 0.12, 0.5, 4, '#3a3530');

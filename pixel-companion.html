  // The rest of Whitley Bay behind the rooms, hazy with distance: low hills,
  // terraced rooftops, and the white dome of the Spanish City.
  function drawSkyline(){
    const base = SKY_LINE + 1;
    for (let x = 0; x < W; x += 2){
      const h = 12 + 4 * Math.sin(x / 37) + 3 * Math.sin(x / 13 + 1);
      rect(x, Math.round(base - h), 2, Math.round(h), '#b3c7cc');
    }
    let x = -6, k = 0;
    while (x < W){
      const w = 22 + (k * 7) % 12, h = 10 + (k * 5) % 8;
      rect(x, base - h, w, h, '#98afb8');
      fillPoly([[x - 1, base - h], [x + w + 1, base - h], [x + w / 2, base - h - w / 3]], '#8aa2ac');
      if (k % 2) rect(x + 4, base - h - 6, 3, 6, '#8aa2ac');
      x += w + 3; k++;
    }
    rect(229, base - 18, 22, 18, '#dfe2da');
    blob(240, base - 19, 10, '#eef0e8');
    rect(239, base - 33, 2, 5, '#c9ccc4');
  }

  function drawStreet(){
    const y0 = SKY_LINE, y1 = rowY(PROM_EDGE);
    rect(0, y0, W, y1 - y0, PAL.street);
    // paving joints every two tiles on both diagonals, as clean 2:1 steps
    for (let yy = y0 + 2; yy < y1; yy++){
      const a = ((OX - 2 * (yy - OY)) % 32 + 32) % 32;
      const b = ((OX + 2 * (yy - OY)) % 32 + 32) % 32;
      for (let x = a; x < W; x += 32) rect(x, yy, 2, 1, PAL.streetLine);
      for (let x = b; x < W; x += 32) rect(x, yy, 2, 1, PAL.streetLine);
    }
    rect(0, y0, W, 2, PAL.kerb);
  }

  // The sea wall, its white railings, and the steps down to the sand.
  const STEPS_X = OX + 18 * (TW / 2);
  function drawPromenadeEdge(){
    const top = rowY(PROM_EDGE);
    rect(0, top, W, BEACH_DROP, PAL.seaWall);
    rect(0, top, W, 1, shade(PAL.seaWall, 0.12));
    rect(0, top + 4, W, 1, PAL.seaWallDark);
    for (let x = 0; x < W; x += 12){ rect(x, top + 1, 1, 3, PAL.seaWallDark); rect(x + 6, top + 5, 1, 3, PAL.seaWallDark); }
    for (let k = 0; k < 3; k++){
      const y = top + k * 3, x0 = STEPS_X - 14 - k * 2, w = 28 + k * 4;
      rect(x0, y, w, 3, shade(PAL.seaWall, 0.10 - k * 0.05));
      rect(x0, y + 2, w, 1, PAL.seaWallDark);
    }
    const railY = top - 9;
    for (let x = 4; x < W; x += 12){
      if (x > STEPS_X - 18 && x < STEPS_X + 16) continue;
      rect(x - 1, railY, 4, 10, PAL.outline); rect(x, railY, 2, 9, PAL.rail);
    }
    for (const [a, b] of [[0, STEPS_X - 16], [STEPS_X + 16, W]]){
      rect(a, railY - 1, b - a, 4, PAL.outline); rect(a, railY, b - a, 2, PAL.rail);
    }
  }

  const beachPt = (s, d) => { const p = atRow(s, d); return iso(p.x, p.y, -BEACH_DROP); };
  function drawBeachSand(){
    const y0 = rowY(PROM_EDGE) + BEACH_DROP, y1 = rowY(HIGH_WATER_S) + BEACH_DROP;
    rect(0, y0, W, y1 - y0, PAL.sand);
    rect(0, y0, W, 2, PAL.sandDark);
    speckle(0, y0 + 3, W, y1 - y0 - 3, PAL.sandLight, 0.004, 3);
    speckle(0, y0 + 3, W, y1 - y0 - 3, PAL.sandDark, 0.003, 9);
    // a striped windbreak, some rocks, a bucket: all kept clear of where he strolls
    const [wx, wy] = beachPt(23, -3);
    for (let k = 0; k < 4; k++) rect(Math.round(wx) - 16 + k * 8, Math.round(wy) - 11, 8, 10, k % 2 ? '#f2ece0' : '#c0574a');
    for (let k = 0; k < 5; k++) rect(Math.round(wx) - 17 + k * 8, Math.round(wy) - 13, 1, 13, '#5a4032');
    for (const [s, d, rr] of [[25.5, 41, 5], [26.5, 43.5, 4], [24.5, 44, 3]]){
      const [rx, ry] = beachPt(s, d);
      blob(Math.round(rx), Math.round(ry) - rr + 2, rr, '#8f8a80');
    }
    const [bx, by] = beachPt(26, 5);
    rect(Math.round(bx) - 3, Math.round(by) - 5, 6, 5, '#d94a3e'); rect(Math.round(bx) - 3, Math.round(by) - 6, 6, 1, PAL.outline);
    rect(Math.round(bx) + 4, Math.round(by) - 9, 1, 9, '#e0b13b');
  }

  function drawStreetProps(){
    LAMPS.forEach(p => lampPost(p, false));
    drawBench();
    tree(atRow(10, -10));
    tree(atRow(10, 46));
    const pb = atRow(9, -7);                                 // a red postbox
    isoBox(pb.x - 0.25, pb.y - 0.25, 0, 0.5, 0.5, 13, '#c0392b');
    isoBox(pb.x - 0.3, pb.y - 0.3, 13, 0.6, 0.6, 2, '#2a2320');
    const pl = atRow(9.5, 44);                               // a planter of flowers
    isoBox(pl.x - 0.6, pl.y - 0.25, 0, 1.2, 0.5, 5, '#8a5a44');
    const [fx, fy] = iso(pl.x, pl.y, 5);
    flower(Math.round(fx) - 5, Math.round(fy) - 8, PAL.flowerRed);
    flower(Math.round(fx), Math.round(fy) - 9, PAL.flowerYellow);
    flower(Math.round(fx) + 5, Math.round(fy) - 8, PAL.flowerWhite);
  }

  // Signs above the shops, standing on the back wall like a fascia.
  function shopSign(r, color, icon){
    const q = wallQuad(onR, r, 1.6, WALL + 1, 2.8, 11);
    fillPoly(wallQuad(onR, r, 1.5, WALL, 3.0, 13), PAL.outline);
    fillPoly(q, color);
    const [cx, cy] = onR(r, 3.0, WALL + 6.5);
    icon(Math.round(cx), Math.round(cy));
  }
  const cupIcon = (x, y) => { rect(x - 3, y - 2, 5, 4, '#f2ece0'); rect(x + 2, y - 1, 2, 2, '#f2ece0'); rect(x - 2, y - 5, 1, 2, '#f2ece0'); rect(x, y - 6, 1, 3, '#f2ece0'); };
  const bookIcon = (x, y) => { rect(x - 4, y - 3, 4, 6, '#f2ece0'); rect(x + 1, y - 3, 4, 6, '#f2ece0'); rect(x, y - 3, 1, 6, '#c9b48a'); };

  // --- the static layer ---
  // Everything that never moves is drawn once into an offscreen canvas; each
  // frame just copies it. Transparent where the sky, the sea and the window
  // panes show through, since those are live.
  let staticLayer = null;
  const stubLayers = {};
  function newLayer(){ const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
  function drawInto(cv, fn){
    const keep = ctx;
    ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    try { fn(); } finally { ctx = keep; }
  }

  function buildStatic(){
    WINDOW_PANES.length = 0;
    staticLayer = newLayer();
    drawInto(staticLayer, () => {
      drawSkyline();
      drawStreet();
      const furnish = { home: furnishHome, bookstore: furnishBookstore, cafe: furnishCafe, work: furnishWork };
      for (const r of ROOMS){
        drawRoomShell(r);
        furnish[r.id](r);
        drawStubs(r);
      }
      shopSign(ROOM_BY_ID.bookstore, PAL.bookSign, bookIcon);
      shopSign(ROOM_BY_ID.cafe, '#3e2723', cupIcon);
      drawStreetProps();
      drawPromenadeEdge();
      drawBeachSand();
      ctx.globalCompositeOperation = 'destination-out';
      for (const p of WINDOW_PANES) fillPoly(p.pane, '#000');
      ctx.globalCompositeOperation = 'source-over';
      for (const p of WINDOW_PANES) drawMullions(p);
    });
    for (const r of ROOMS){
      stubLayers[r.id] = newLayer();
      drawInto(stubLayers[r.id], () => drawStubs(r));
    }
  }

  // The sky seen through each window, rain and all: weather is outdoors, so
  // it belongs in the view, not the room.
  function drawWindowViews(t, w){
    for (const p of WINDOW_PANES){
      const [x, y, ww, hh] = p.bbox;
      skyGradient(x, y, ww, hh);
      if (w === 'rainy') rainOn(ctx, t, x, y, ww, hh, Math.max(3, (ww * hh / 55) | 0));
      else if (w === 'snowy') snowOn(ctx, t, x, y, ww, hh, Math.max(2, (ww * hh / 90) | 0));
      else if (w === 'foggy') rect(x, y, ww, hh, PAL.fog);
    }
  }

  // ---------- sea, tide, ships ----------
  function waterlineY(){
    const n = state.tide ? state.tide.norm : 0.5;          // mid-tide if we don't know
    return Math.round(rowY(HIGH_WATER_S) + BEACH_DROP + 2 + (1 - n) * 16);
  }

  function drawSea(t){
    const wetTop = rowY(HIGH_WATER_S) + BEACH_DROP, wl = waterlineY(), n = curSky.night;
    rect(0, wetTop, W, wl - wetTop + 2, PAL.sandWet);      // what the tide has uncovered
    const near = mix(PAL.seaDayFar, PAL.seaNightFar, n), far = mix(PAL.seaDay, PAL.seaNight, n);
    const g = ctx.createLinearGradient(0, wl, 0, H);
    g.addColorStop(0, near); g.addColorStop(1, far);
    ctx.fillStyle = g; ctx.fillRect(0, wl, W, H - wl);
    if (curSky.glow > 0.02) rect(0, wl, W, H - wl, 'rgba(255,150,120,' + (0.22 * curSky.glow * (1 - n * 0.5)).toFixed(3) + ')');
    for (let row = 0; wl + 6 + row * 9 < H; row++){
      const ry = wl + 6 + row * 9, depth = Math.min(1, row / 12);
      const len = 4 + (row % 3) * 2, gap = 30 + (row % 4) * 6, speed = 0.6 + (row % 3) * 0.3, dir = row % 2 ? 1 : -1;
      ctx.fillStyle = n < 0.5 ? 'rgba(233,246,250,' + (0.30 - depth * 0.12).toFixed(2) + ')' : 'rgba(180,205,225,' + (0.22 - depth * 0.08).toFixed(2) + ')';
      const off = ((t * speed * dir + row * 17) % gap + gap) % gap;
      for (let x = -gap + off; x < W; x += gap) ctx.fillRect(Math.round(x), ry, len, 1);
    }
    const wash = Math.sin(t / 22) * 2;
    ctx.fillStyle = PAL.seaFoam;
    for (let x = 0; x < W; x += 2) ctx.fillRect(x, Math.round(wl + wash + Math.sin(x / 17 + t / 5) * 1.5), 2, 2);
  }

  // St Mary's Island and its lighthouse, up the coast to the north: your right.
  const ISLAND = { x: 452, y: rowY(HIGH_WATER_S) + BEACH_DROP + 40 };
  function drawIsland(t){
    const { x, y } = ISLAND;
    blob(x - 9, y, 7, '#7d776a'); blob(x + 8, y + 1, 6, '#7d776a'); blob(x, y - 2, 9, '#8a8474');
    rect(x - 10, y - 8, 20, 3, '#6f9e5f');
    rect(x + 3, y - 14, 8, 6, PAL.outline); rect(x + 4, y - 13, 6, 5, '#eeeae0'); rect(x + 4, y - 15, 6, 2, '#8a3f30');   // keeper's cottage
    rect(x - 5, y - 35, 8, 28, PAL.outline); rect(x - 4, y - 34, 6, 27, '#f2eee4'); rect(x - 4, y - 34, 2, 27, '#fffdf6');
    rect(x - 6, y - 39, 10, 4, PAL.outline); rect(x - 3, y - 38, 4, 3, '#8f9aa0');
    if (lampsOn() && Math.floor(t / 8) % 3 === 0){
      addLight(x - 1, y - 37, 26, '255,236,180', 0.6, () => rect(x - 3, y - 38, 4, 3, '#fff3c4'));
    }
  }

  // Where a real vessel sits. You face west, so north (0°) is on your right
  // and south (180°) on your left; the arc is wider than a literal half
  // circle because traffic bunches at the Tyne mouth and north past St Mary's.
  // Distance runs down the water: close in near the beach, far out at the front.
  const VIEW_ARC = 120;
  function boatScreenPos(b, seaTop){
    let off = b.bearing - 90;
    if (off > 180) off -= 360;
    if (off < -180) off += 360;
    const fx = Math.max(-1, Math.min(1, off / VIEW_ARC));
    const f = Math.pow(Math.min(b.distanceKm, 16) / 16, 0.7);
    return { x: W / 2 - fx * 200, y: seaTop + 16 + f * (H - seaTop - 30), s: 1.15 };
  }

  function drawBoat(cx, waterY, s, cat){
    let L, hullH, hull, style;
    switch (cat) {
      case 'cargo':     L=24; hullH=5; hull=PAL.hullRed;   style='cargo';   break;
      case 'tanker':    L=26; hullH=6; hull=PAL.hullBlack; style='cargo';   break;
      case 'passenger': L=22; hullH=5; hull=PAL.hullBlue;  style='ferry';   break;
      case 'military':  L=19; hullH=4; hull=PAL.hullGrey;  style='ferry';   break;
      case 'fast':      L=13; hullH=3; hull=PAL.hullWhite; style='fast';    break;
      case 'tug':       L=10; hullH=4; hull=PAL.hullRed;   style='tug';     break;
      case 'service':   L=12; hullH=4; hull='#c98b3a';     style='tug';     break;
      case 'fishing':   L=11; hullH=4; hull='#2f6b8a';     style='fishing'; break;
      case 'sailing':   L=9;  hullH=3; hull=PAL.hullWhite; style='sail';    break;
      case 'pleasure':  L=9;  hullH=3; hull=PAL.hullWhite; style='fast';    break;
      default:          L=12; hullH=4; hull='#7a6a58';     style='fishing';
    }
    L *= s; hullH = Math.max(2, hullH * s);
    const half = L / 2;

    ctx.save();
    ctx.translate(cx, waterY);

    // Reflection first, so the hull sits on top of it.
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = hull;
    for (let i = 1; i <= 3; i++) ctx.fillRect(-half*0.7, i*Math.max(1,s), L*0.7, Math.max(1, s*0.6));
    ctx.globalAlpha = 1;

    const deck = -hullH;
    // Outlined hull: raked bow to the right, tucked-in stern to the left.
    ctx.fillStyle = PAL.outline;
    ctx.beginPath();
    ctx.moveTo(-half-1, deck-1); ctx.lineTo(half+1, deck-1);
    ctx.lineTo(half-hullH*0.7, 1); ctx.lineTo(-half+hullH*0.5, 1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = hull;
    ctx.beginPath();
    ctx.moveTo(-half, deck); ctx.lineTo(half, deck);
    ctx.lineTo(half-hullH*0.7, 0); ctx.lineTo(-half+hullH*0.5, 0);
    ctx.closePath(); ctx.fill();
    // Sunlit strip along the deck edge.
    ctx.fillStyle = shade(hull, 0.16);
    ctx.fillRect(-half+1, deck, L-2, Math.max(1, s*0.7));

    const up = (h) => deck - h;   // superstructure sits on the deck
    const bw = (n) => Math.max(1, Math.round(n*s));

    if (style === 'cargo') {
      // Blocky accommodation aft, cargo stacked along the deck.
      const sw = bw(5), sh = bw(6);
      rect(-half+bw(1), up(sh), sw, sh, PAL.superWhite);
      rect(-half+bw(1), up(sh), sw, bw(1), shade(PAL.superWhite, 0.15));
      rect(-half+bw(2), up(bw(1)+sh*0.55), bw(3), bw(1), PAL.boatWindow);
      rect(-half+bw(2), up(sh+bw(3)), bw(2), bw(3), PAL.funnelRed);   // funnel
      const boxes = ['#3f7a55','#9c5a3c','#3d5f86','#8a7a3a'];
      for (let i = 0; i < 4; i++) {
        rect(-half+bw(8)+i*bw(4), up(bw(3)), bw(3), bw(3), boxes[i % boxes.length]);
      }
    } else if (style === 'ferry') {
      // Two tiers of white superstructure with a row of windows.
      const sh = bw(4);
      rect(-half+bw(2), up(sh), L-bw(6), sh, PAL.superWhite);
      rect(-half+bw(4), up(sh+bw(3)), L-bw(12), bw(3), shade(PAL.superWhite, -0.06));
      for (let i = 0; i < 5; i++) rect(-half+bw(4)+i*bw(3), up(sh*0.6), bw(2), bw(1), PAL.boatWindow);
      rect(-bw(1), up(sh+bw(6)), bw(3), bw(3), PAL.funnelRed);
    } else if (style === 'tug') {
      // Short and tall — wheelhouse high above a stubby hull.
      rect(-bw(2), up(bw(6)), bw(5), bw(6), PAL.superWhite);
      rect(-bw(1), up(bw(4)), bw(3), bw(1), PAL.boatWindow);
      rect(bw(1), up(bw(9)), bw(2), bw(3), PAL.funnelRed);
    } else if (style === 'fishing') {
      // Wheelhouse forward, mast and derrick aft.
      rect(bw(1), up(bw(4)), bw(4), bw(4), PAL.superWhite);
      rect(bw(2), up(bw(3)), bw(2), bw(1), PAL.boatWindow);
      rect(-bw(3), up(bw(9)), Math.max(1, bw(1)), bw(9), PAL.mast);
      ctx.strokeStyle = PAL.mast; ctx.lineWidth = Math.max(1, s*0.5);
      ctx.beginPath(); ctx.moveTo(-bw(3), up(bw(9))); ctx.lineTo(bw(3), up(bw(4))); ctx.stroke();
    } else if (style === 'sail') {
      // Mast plus a single triangular sail.
      rect(0, up(bw(14)), Math.max(1, bw(1)), bw(14), PAL.mast);
      ctx.fillStyle = PAL.outline;
      ctx.beginPath();
      ctx.moveTo(-1, up(bw(14))-1); ctx.lineTo(-1, up(bw(1)));
      ctx.lineTo(-bw(7)-1, up(bw(1))); ctx.closePath(); ctx.fill();
      ctx.fillStyle = PAL.sail;
      ctx.beginPath();
      ctx.moveTo(0, up(bw(13))); ctx.lineTo(0, up(bw(2)));
      ctx.lineTo(-bw(6), up(bw(2))); ctx.closePath(); ctx.fill();
    } else if (style === 'fast') {
      rect(-bw(2), up(bw(3)), bw(5), bw(3), PAL.superWhite);
      rect(-bw(1), up(bw(2)), bw(3), bw(1), PAL.boatWindow);
    }

    ctx.restore();
  }

  // Real vessels show lights at night, and what they show depends on what
  // they're doing. One under way shows a white masthead light and a sidelight:
  // seen from the east, a northbound ship (heading right here) shows its green
  // starboard side, a southbound one its red port side. One at anchor or
  // moored, which is most of what waits off the Tyne, shows only a white
  // all-round anchor light.
  function addShipLights(x, y, q){
    const d = Math.max(1, Math.round(q.s * 0.8));
    const r = 3 + q.s * 2.2;
    const dot = (lx, ly, col) => () => rect(Math.round(lx - d / 2), Math.round(ly - d / 2), d, d, col);
    const topY = y - 13 * q.s;
    addLight(x, topY, r, '255,250,230', 0.32, dot(x, topY, '#fffbea'));
    if (q.b.moving){
      const dir = q.left ? -1 : 1;
      const sx = x + dir * q.hw * 0.33, sy = y - 4 * q.s;
      const green = !q.left;
      addLight(sx, sy, r, green ? '90,255,140' : '255,80,70', 0.38, dot(sx, sy, green ? '#7dffa6' : '#ff6a5c'));
    }
  }

  function drawShips(t){
    state.boatHits.length = 0;
    const seaTop = waterlineY();
    const elapsed = (Date.now() - state.boatsAt) / 1000;
    const placed = [];
    for (const b of state.boats){
      const pos = boatScreenPos(b, seaTop);
      const left = Math.cos((b.course || 0) * Math.PI / 180) < 0;    // heading south: to your left
      const drift = Math.max(-12, Math.min(12, (b.speedKts || 0) * elapsed * 0.05)) * (left ? -1 : 1);
      placed.push({ b, left, s: pos.s, x: pos.x + drift,
        y: pos.y + Math.sin((t / 9) + b.distanceKm) * 1.2, hw: 30, hh: 24 });
    }
    // Ships queueing for the same river mouth land almost on top of one
    // another; nudge apart any that would overlap, so each stays hoverable.
    placed.sort((a, b) => a.x - b.x);
    for (let i = 1; i < placed.length; i++){
      const prev = placed[i - 1], cur = placed[i], need = (prev.hw + cur.hw) * 0.5 + 3;
      if (Math.abs(cur.y - prev.y) < 15 && cur.x - prev.x < need) cur.x = prev.x + need;
    }
    for (const q of placed) q.x = Math.max(16, Math.min(W - 16, q.x));

    // island and ships, back to front
    const items = placed.map(q => ({ y: q.y, draw: () => {
      const x = Math.round(q.x), y = Math.round(q.y);
      ctx.save(); ctx.translate(x, y); if (q.left) ctx.scale(-1, 1);
      drawBoat(0, 0, q.s, q.b.category);
      ctx.restore();
      state.boatHits.push({ x: x - q.hw / 2, y: y - q.hh + 4, w: q.hw, h: q.hh, boat: q.b });
      if (lampsOn()) addShipLights(x, y, q);
    } }));
    items.push({ y: ISLAND.y, draw: () => drawIsland(t) });
    items.sort((a, b) => a.y - b.y).forEach(it => it.draw());
  }

  // ---------- light, dark and weather ----------
  // Scenes register light sources as they draw; once everything's on the
  // canvas, finishScene() shades the lot for the time of day (him included)
  // and paints the lights back on top so they glow into the dark.
  const lights = [];
  function addLight(x, y, r, rgb, alpha, redraw){ lights.push({ x, y, r, rgb, alpha, redraw }); }
  function glow(x, y, r, rgb, alpha){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + alpha + ')');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const WARM = '255,196,120';

  // Lamps in the rooms and along the promenade, once it's getting dark.
  function registerLamps(){
    if (!lampsOn()) return;
    const at = (r, lx, ly, z) => iso(r.ox + lx, r.oy + ly, z);
    for (const r of ROOMS){                                  // a lit room glows from within
      const [cx, cy] = at(r, 3, 3, 14);
      addLight(cx, cy, 64, WARM, 0.14);
    }
    const H0 = ROOM_BY_ID.home, BK = ROOM_BY_ID.bookstore, CF = ROOM_BY_ID.cafe, WK = ROOM_BY_ID.work;
    let p = at(H0, 2.85, 4.35, 17);
    addLight(p[0], p[1], 46, WARM, 0.34, () => isoBox(H0.ox + 2.6, H0.oy + 4.1, 14, 0.5, 0.5, 5, '#ffd27a', { outline: false }));
    p = at(H0, 4.7, 0.65, 20);
    addLight(p[0], p[1], 16, '255,140,80', 0.30);            // the lizard's heat lamp
    p = at(BK, 1.0, 4.0, 31);
    addLight(p[0], p[1], 46, WARM, 0.34, () => isoBox(BK.ox + 0.65, BK.oy + 3.65, 28, 0.75, 0.75, 6, '#ffd27a', { outline: false }));
    p = onR(CF, 0.78, 31.5);
    addLight(p[0], p[1], 44, '255,200,120', 0.30, () => fillPoly(wallQuad(onR, CF, 0.55, 29, 0.45, 5), '#ffd27a'));
    p = at(CF, 3.5, 0.7, 20);
    addLight(p[0], p[1], 34, '255,200,120', 0.20);
    p = at(WK, 0.5, 1.65, 25);
    addLight(p[0], p[1], 36, WARM, 0.30, () => isoBox(WK.ox + 0.2, WK.oy + 1.4, 23, 0.6, 0.5, 4, '#ffd27a', { outline: false }));
    p = at(WK, 0.6, 3.05, 21);
    addLight(p[0], p[1], 44, '140,190,255', 0.26);           // the screen lights him up
    for (const L of LAMPS){
      const [hx, hy] = iso(L.x, L.y, 33);
      addLight(hx, hy, 30, '255,206,130', 0.5, () => isoBox(L.x - 0.28, L.y - 0.28, 30, 0.56, 0.56, 6, '#ffd88a', { outline: false }));
      const [gx, gy] = iso(L.x + 1.2, L.y + 1.2, 0);
      addLight(gx, gy, 36, '255,190,110', 0.20);             // the pool it throws on the paving
    }
  }

  // Weather has its own layer, with every room's silhouette cut out of it
  // before it goes on screen: rain, snow and fog fall on the street, the
  // beach, the sea and the sky, and never indoors.
  const wxCanvas = newLayer();
  const wxc = wxCanvas.getContext('2d');
  const mod = (a, n) => ((a % n) + n) % n;

  function rainOn(c, t, x0, y0, w, h, n){
    c.fillStyle = PAL.rain;
    for (let i = 0; i < n; i++){
      const x = Math.round(x0 + mod(i * 53 - t * 3, w)), y = Math.round(y0 + mod(i * 29 + t * 12, h));
      c.fillRect(x, y, 1, 3);
      c.fillRect(x - 1, y + 3, 1, 3);
    }
  }
  function snowOn(c, t, x0, y0, w, h, n){
    c.fillStyle = PAL.snow;
    for (let i = 0; i < n; i++){
      const x = Math.round(x0 + mod(i * 37 + Math.sin((t + i) / 8) * 10, w)), y = Math.round(y0 + mod(i * 17 + t * 2, h));
      c.fillRect(x, y, 2, 2);
    }
  }

  function drawOutdoorWeather(t, w){
    if (w !== 'rainy' && w !== 'snowy' && w !== 'foggy') return;
    wxc.clearRect(0, 0, W, H);
    if (w === 'rainy') rainOn(wxc, t, 0, 0, W, H, 170);
    if (w === 'snowy') snowOn(wxc, t, 0, 0, W, H, 120);
    if (w === 'foggy'){ wxc.fillStyle = PAL.fog; wxc.fillRect(0, 0, W, H); }
    wxc.globalCompositeOperation = 'destination-out';
    for (const r of ROOMS) fillPolyOn(wxc, r.silhouette, '#000');
    wxc.globalCompositeOperation = 'source-over';
    ctx.drawImage(wxCanvas, 0, 0);
  }

  function finishScene(t, w){
    const n = curSky.night;
    if (curSky.glow > 0.02) rect(0, 0, W, H, 'rgba(255,150,80,' + (0.12 * curSky.glow * (1 - n)).toFixed(3) + ')');
    if (n > 0.01){
      rect(0, 0, W, H, 'rgba(8,12,26,' + (0.44 * n).toFixed(3) + ')');
      const k = Math.min(1, n / 0.6);               // lights brighten as it darkens
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';     // light adds, never darkens
      for (const L of lights) if (L.r) glow(L.x, L.y, L.r, L.rgb, L.alpha * k);
      ctx.restore();
      const c = state.charBox;                      // never paint a lamp over his face
      for (const L of lights){
        if (!L.redraw) continue;
        if (c && L.x >= c.x && L.x <= c.x + c.w && L.y >= c.y && L.y <= c.y + c.h) continue;
        L.redraw();
      }
    }
    lights.length = 0;
    drawOutdoorWeather(t, w);
  }

  // Small things that move inside the rooms.
  function roomLife(t){
    const CF = ROOM_BY_ID.cafe;
    const [sx, sy] = iso(CF.ox + 1.95, CF.oy + 1.0, 21);
    for (let k = 0; k < 3; k++){                               // steam off the coffee machine
      const rise = mod(t * 1.2 + k * 5, 15);
      ctx.fillStyle = 'rgba(240,240,240,' + (0.5 - rise / 32).toFixed(2) + ')';
      ctx.fillRect(Math.round(sx + Math.sin((t + k * 4) / 3) * 1.5), Math.round(sy - rise), 2, 2);
    }
  }

  // ---------- him ----------
  // Sprites are drawn as little pixel maps, stacked from parts (head, body,
  // legs) and given a dark outline automatically, then cached as tiny canvases.
  const HERO = {
    headFront: ['...hhhhhh...', '..hhhhhhhh..', '.hhhhhhhhhh.', '.hhhsshsshh.', '.hssssssssh.', '.hsessssesh.', '.hsessssesh.', '..bssmmssb..'],
    headFrontBlink: ['...hhhhhh...', '..hhhhhhhh..', '.hhhhhhhhhh.', '.hhhsshsshh.', '.hssssssssh.', '.hssssssssh.', '.hsessssesh.', '..bssmmssb..'],
    headSide: ['...hhhhhh...', '..hhhhhhhhh.', '.hhhhhhhhhh.', '.hhhhsshssh.', '.hhhsssssss.', '.hhhsessses.', '.hhhsessses.', '..hhbsssmb..'],
    headSideBlink: ['...hhhhhh...', '..hhhhhhhhh.', '.hhhhhhhhhh.', '.hhhhsshssh.', '.hhhsssssss.', '.hhhsssssss.', '.hhhsessses.', '..hhbsssmb..'],
    headBack: ['...hhhhhh...', '..hhhhhhhh..', '.hhhhhhhhhh.', '.hhhhhhhhhh.', '.hhhhhhhhhh.', '.HhhhhhhhhH.', '.HHhhhhhhHH.', '..HHhhhhHH..'],
    neck: ['....ssss....'],
    bodyFront: ['..rrrrrrrr..', '.sccccccccs.', '.sccccccccs.', '.sCccccccCs.', '.sCccccccCs.', '..cccccccc..'],
    bodyBack: ['..cccccccc..', '.sccccccccs.', '.sccccccccs.', '.sCccccccCs.', '.sCCccccCCs.', '..cccccccc..'],
    legsStand: ['..pppppppp..', '..ppp..ppp..', '..ppp..ppp..', '..ppp..ppp..', '..PPP..PPP..', '..kkk..kkk..', '..kkk..kkk..'],
    legsWalkA: ['..pppppppp..', '..ppp..ppp..', '..ppp..ppp..', '..ppp..ppp..', '..PPP..kkk..', '..kkk..kkk..', '..kkk.......'],
    legsWalkB: ['..pppppppp..', '..ppp..ppp..', '..ppp..ppp..', '..ppp..ppp..', '..kkk..PPP..', '..kkk..kkk..', '.......kkk..'],
    legsSit: ['..pppppppp..', '..pppppppp..', '..PPp..pPP..', '..kkk..kkk..'],
    legsSitBack: ['..pppppppp..', '..PPPPPPPP..'],
  };
  const heroCache = new Map();
  function heroSprite(head, body, legs){
    const key = head + '|' + body + '|' + legs;
    if (heroCache.has(key)) return heroCache.get(key);
    const rows = [...HERO[head], ...HERO.neck, ...HERO[body], ...HERO[legs]];
    const cols = {
      h: PAL.hair, H: shade(PAL.hair, -0.1), s: PAL.skin, e: PAL.ink, b: PAL.blush, m: PAL.mouth,
      c: PAL.shirt, C: shade(PAL.shirt, -0.12), r: PAL.shirt2, p: PAL.pants, P: shade(PAL.pants, -0.12), k: PAL.shoe,
    };
    const w = rows[0].length, h = rows.length;
    const cv = document.createElement('canvas');
    cv.width = w + 2; cv.height = h + 2;
    const c = cv.getContext('2d');
    const solid = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== '.';
    c.fillStyle = PAL.outline;
    for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++){
      if (!solid(x, y) && (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1))) c.fillRect(x + 1, y + 1, 1, 1);
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      const ch = rows[y][x];
      if (ch !== '.'){ c.fillStyle = cols[ch]; c.fillRect(x + 1, y + 1, 1, 1); }
    }
    heroCache.set(key, cv);
    return cv;
  }

  function heroPose(now){
    const place = placeInfo(state.location);
    const walking = state.walking;
    const seated = !walking && place && place.seat > 0;
    const back = walking ? state.facing === 'back' : place.pose === 'back';
    const side = walking && state.facing === 'side';
    const tick = Math.floor(now / 180);
    const bt = tick % 29;                              // a blink every ~5s, sometimes a double
    const blink = !back && (bt === 0 || (bt === 2 && tick % 87 === 2));
    const head = (back ? 'headBack' : side ? 'headSide' : 'headFront') + (blink ? 'Blink' : '');
    const step = Math.floor(now / 160) % 2;
    const legs = walking ? (step ? 'legsWalkA' : 'legsWalkB') : seated ? (back ? 'legsSitBack' : 'legsSit') : 'legsStand';
    return { head, body: back ? 'bodyBack' : 'bodyFront', legs, lift: seated ? Math.max(0, place.seat - 4) : 0, bob: walking && step ? 1 : 0 };
  }

  function drawHero(now){
    const p = heroPose(now);
    const [fx, fy] = iso(state.pos.x, state.pos.y, state.pos.z || 0);
    const sx = Math.round(fx), sy = Math.round(fy);
    const cv = heroSprite(p.head, p.body, p.legs);
    ctx.fillStyle = 'rgba(20,16,12,0.28)';            // a soft shadow grounds him
    ctx.fillRect(sx - 5, sy - 1, 10, 2);
    ctx.fillRect(sx - 3, sy + 1, 6, 1);
    const x0 = sx - (cv.width >> 1), y0 = sy - p.lift - p.bob - (cv.height - 2);
    if (state.flip){
      ctx.save(); ctx.translate(x0 + cv.width, y0); ctx.scale(-1, 1); ctx.drawImage(cv, 0, 0); ctx.restore();
    } else {
      ctx.drawImage(cv, x0, y0);
    }
    state.charBox = { x: x0 - 2, y: y0 - 2, w: cv.width + 4, h: cv.height + 4 };
    state.heroScreen = [sx, y0];
  }

  // ---------- walking ----------
  const WALK_SPEED = 3;                              // tiles a second
  function startWalk(points, arriveAt){
    state.path = points.map(p => ({ x: p.x, y: p.y, z: p.z || 0 }));
    state.walking = true;
    state.walkTo = arriveAt;
    if (arriveAt) document.getElementById('locPill').textContent = 'WALKING…';
  }

  function faceToward(dx, dy, dz){
    const sdx = (dx - dy) * (TW / 2), sdy = (dx + dy) * (TH / 2) - dz;
    state.flip = sdx < -0.01;
    if (Math.abs(sdx) > Math.abs(sdy) * 1.6) state.facing = 'side';
    else state.facing = sdy < 0 ? 'back' : 'front';
  }

  function stepWalk(dt){
    if (!state.walking) return;
    let move = WALK_SPEED * dt / 1000;
    const pos = state.pos;
    while (move > 0 && state.path.length){
      const tg = state.path[0];
      const dx = tg.x - pos.x, dy = tg.y - pos.y, dz = tg.z - pos.z;
      const dist = Math.hypot(dx, dy) || Math.abs(dz) / 8;
      if (dist > 0.001) faceToward(dx, dy, dz);
      if (dist <= move){
        pos.x = tg.x; pos.y = tg.y; pos.z = tg.z;
        state.path.shift();
        move -= dist;
      } else {
        const f = move / dist;
        pos.x += dx * f; pos.y += dy * f; pos.z += dz * f;
        move = 0;
      }
    }
    if (!state.path.length) arrive();
  }

  function arrive(){
    state.walking = false;
    state.flip = false;
    const to = state.walkTo;
    state.walkTo = null;
    if (!to) return;
    state.location = to;
    updateStatusUI();
    if (to === 'beach') fetchBoats();
    showSpeech(pickSpeech());
  }

  // At the beach he doesn't stand still for long.
  function maybeStroll(){
    if (document.hidden || state.walking || state.location !== 'beach' || Math.random() < 0.4) return;
    startWalk([atRow(22.8 + Math.random() * 2.6, 8 + Math.random() * 26, -BEACH_DROP)], null);
  }

  // ---------- speech bubble ----------
  // Anchored above his head, wherever he is, and kept inside the frame.
  const frameBox = canvas.parentElement;
  const speechEl = document.getElementById('speech');
  function placeSpeech(){
    if (!speechEl.classList.contains('show') || !state.heroScreen) return;
    const [hx, hy] = state.heroScreen;
    const r = canvas.getBoundingClientRect(), fr = frameBox.getBoundingClientRect();
    const px = hx / W * r.width + (r.left - fr.left);
    const py = (hy - 3) / H * r.height + (r.top - fr.top);
    const half = speechEl.offsetWidth / 2;
    const cx = Math.max(half + 6, Math.min(fr.width - half - 6, px));
    speechEl.style.left = cx + 'px';
    speechEl.style.top = py + 'px';
    speechEl.style.setProperty('--tail', Math.max(12, Math.min(2 * half - 12, half + px - cx)) + 'px');
  }

  // ---------- main render loop ----------
  let lastFrame = performance.now();
  function render(){
    const now = performance.now();
    const dt = Math.min(250, now - lastFrame);
    lastFrame = now;
    const t = now / 180;                              // animation clock, in the old 180ms ticks
    const w = mapWeather(state.weather.code);
    curSky = skyState();
    lights.length = 0;
    state.charBox = null;
    if (!staticLayer) buildStatic();
    stepWalk(dt);

    curWeather = w;
    skyGradient(0, 0, W, SKY_LINE + 2);
    // An overcast sky is grey, not blue. Only the sky: the rooms stay as they are.
    const overcast = { rainy: 0.45, snowy: 0.35, foggy: 0.4, cloudy: 0.15 }[w] || 0;
    if (overcast) rect(0, 0, W, SKY_LINE + 2, 'rgba(150,160,170,' + overcast + ')');
    drawSkyDetails(t, w, SKY_LINE);
    drawWindowViews(t, w);
    drawSea(t);
    ctx.drawImage(staticLayer, 0, 0);
    drawShips(t);
    roomLife(t);
    registerLamps();
    drawHero(now);
    const inRoom = roomAt(state.pos);
    if (inRoom) ctx.drawImage(stubLayers[inRoom.id], 0, 0);   // the front wall is between him and you
    finishScene(t, w);
    placeSpeech();
    state.tick += 1;
  }


  // Draw only while someone can see him. Sitting in the tray all day, the
  // window is hidden far more than it's shown. Faster frames while he's
  // walking, so he moves smoothly; slower when he's settled. The boat poll
  // pauses too; the server keeps listening to AIS either way.
  let renderTimer = null;
  function frame(){
    renderTimer = null;
    if (document.hidden) return;
    try { render(); } catch (e) { console.error('render failed', e); }
    renderTimer = setTimeout(frame, state.walking ? 80 : 160);
  }
  function syncRendering(){
    if (document.hidden){
      clearTimeout(renderTimer); renderTimer = null;
    } else if (!renderTimer){
      fetchBoats();                                   // come back to a current sea
      lastFrame = performance.now();
      frame();
    }
  }
  state.pos = { ...routeTo(state.location).at(-1) };
  document.addEventListener('visibilitychange', syncRendering);
  syncRendering();
  setInterval(() => { if (!document.hidden) fetchBoats(); }, 45000);
  fetchTide();
  setInterval(fetchTide, 30*60*1000);   // the forecast itself rarely changes
  setInterval(updateTide, 60*1000);     // but where we are within it does
  setInterval(()=> maybeRelocate(false), 45000);
  setInterval(fetchWeather, 30*60*1000);
  setInterval(maybeStroll, 7000);

  document.getElementById('nudgeBtn').addEventListener('click', ()=>{
    if (state.walking && state.walkTo) return;
    const pool = LOCATIONS.filter(l => l !== state.location);
    goTo(pool[Math.floor(Math.random()*pool.length)]);
  });
  document.getElementById('refreshBtn').addEventListener('click', fetchWeather);

  // ---------- chat: local Claude Code bridge, with an offline fallback ----------
  const CHAT_REPLIES = [
    { keys: ['hi','hey','hello','morning','evening','alright'], lines: ["Oh, hey.", "Hiya.", "Alright?", "Hello there."] },
    { keys: ['how are you','you ok','you alright','how you doing','how\'s it going'],
      lines: ["Not bad, ta. Just pottering about.", "Can't complain, apart from maybe the weather.", "Doing alright, thanks. You?"] },
    { keys: ['lizard','dragon','beardie','pet'],
      lines: ["He's just sat there judging me, as usual.", "The lizard hasn't said much today either.", "He only really cares about heat lamps and crickets.", "Still my favourite housemate, even if he never talks back."] },
    { keys: ['weather','rain','raining','snow','snowing','sun','sunny','fog','foggy','cold','hot'],
      lines: null }, // handled specially below (uses live weather)
    { keys: ['work','job','busy'],
      lines: ["Trying to get through it, honestly.", "Nearly done for today, I think.", "Work's work. Nothing exciting to report."] },
    { keys: ['coffee','cafe','tea','flat white'],
      lines: ["Fancy a coffee run?", "This place does a decent flat white, not gonna lie.", "I could go for a cuppa, actually."] },
    { keys: ['book','books','bookstore','bookshop','reading','read '],
      lines: ["Picked up something new the other day.", "Could happily lose an afternoon in there.", "Bit of a pile building up on my table, if I'm honest."] },
    { keys: ['thanks','thank you','cheers','ta'],
      lines: ["No bother.", "Anytime.", "Course."] },
    { keys: ['bye','see you','later','night','goodnight'],
      lines: ["See you in a bit.", "Catch you later.", "Night, then."] },
    { keys: ['love','nice','great','cool','awesome','good job','well done'],
      lines: ["Aw, cheers.", "Stop it, you'll make me blush.", "That's kind of you to say."] },
    { keys: ['who are you','what are you','tell me about yourself'],
      lines: ["Just someone living quietly round here, really.", "Not much to tell — home, cafe, work, repeat.", "Ask the lizard, he's known me longer."] },
    { keys: ['bored','tired','sleepy','knackered'],
      lines: ["Same, honestly.", "Might just sit down for a bit.", "Today's been a lot, hasn't it."] },
  ];

  function appendChatLine(who, text){
    const log = document.getElementById('chatLog');
    const line = document.createElement('div');
    line.className = 'chatline ' + who;
    // System notices aren't him talking, so they don't wear his label.
    const label = who === 'you' ? 'YOU' : who === 'system' ? 'NOTE' : 'HIM';
    const tag = document.createElement('span');
    tag.className = 'who';
    tag.textContent = label;
    line.append(tag, document.createTextNode(text));   // text, never markup
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function localReply(text){
    const lower = text.toLowerCase();
    const w = mapWeather(state.weather.code);

    for (const group of CHAT_REPLIES){
      if (!group.keys.some(k => lower.includes(k))) continue;
      if (group.lines === null){
        // weather-related question — answer with the actual current weather
        const wLines = {
          sunny: "It's lovely and sunny out, actually.",
          cloudy: "Bit grey and cloudy today.",
          foggy: "Proper foggy — can barely see the front gate.",
          rainy: "Chucking it down, if you hadn't noticed.",
          snowy: "It's snowing! Might build something small later.",
        };
        return wLines[w] || "Not sure, to be honest — hasn't changed much today.";
      }
      return group.lines[Math.floor(Math.random() * group.lines.length)];
    }
    // no keyword match — fall back to the existing location/weather speech pool
    return pickSpeech();
  }

  const BRIDGE_URL = '/chat'; // relative: same-origin once served by companion-server.js
  state.bridgeProblem = null;   // last chat-bridge failure reason we told the user about
  state.bridgeRetryAt = 0;      // after a failure, when to try the bridge again

  async function bridgeReply(text){
    const w = mapWeather(state.weather.code);
    const controller = new AbortController();
    // must exceed companion-server.js's own timeout (45s for search-triggered
    // requests) — otherwise the browser gives up before the server does and
    // silently falls back to offline replies even though the server would
    // have succeeded given a bit longer.
    const timer = setTimeout(()=> controller.abort(), 50000);
    try{
      const res = await fetch(BRIDGE_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          tide: tideWord(),
          message: text,
          weather: weatherLabel(w).toLowerCase(),
          location: state.location,
          isDay: isDaytime(),
          sky: skyState().phase,
          moon: moonName(moonPhase()),
        }),
        signal: controller.signal,
      });
      if (!res.ok){
        const body = await res.json().catch(()=>({}));
        const e = new Error(body?.error || `HTTP ${res.status}`);
        e.reason = body?.reason || 'other';
        throw e;
      }
      const data = await res.json();
      return data.reply || null;
    }finally{
      clearTimeout(timer);
    }
  }

  // Said once per kind of problem, so a run of failures doesn't flood the log.
  const BRIDGE_PROBLEMS = {
    auth: "Real chat is paused — Claude Code isn't logged in. Open Terminal, run `claude` and log in; he'll pick it back up by himself. Offline replies till then.",
    missing: "Can't find Claude Code on this Mac, so he's on offline replies.",
    timeout: 'Claude took too long with that one — offline reply instead.',
    offline: 'No chat bridge running — offline replies. (Open him via the app, or run `node companion-server.js`, for real replies.)',
    other: 'The chat bridge hit a snag — offline replies for a minute.',
  };

  async function sendChat(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    appendChatLine('you', text);

    // Try the local Claude Code chat bridge first (companion-server.js); if it's
    // not running or errors, fall back to the fully offline keyword replies.
    // A failure only pauses the bridge for a minute rather than switching it
    // off for good — this runs all day in the tray, and an expired login or a
    // slow reply shouldn't mean canned answers until the next restart.
    if (Date.now() >= (state.bridgeRetryAt || 0)){
      try{
        const reply = await bridgeReply(text);
        if (reply){
          if (state.bridgeProblem) appendChatLine('system', 'Real replies are back.');
          state.bridgeProblem = null;
          state.bridgeRetryAt = 0;
          appendChatLine('him', reply);
          showSpeech(reply.length > 70 ? reply.slice(0, 67) + '…' : reply);
          return;
        }
      }catch(e){
        // A fetch that never got an HTTP response means no server at all
        // (e.g. opened as a plain file), not a server that answered with an error.
        const reason = e.reason || (e.name === 'AbortError' ? 'timeout' : 'offline');
        if (reason !== state.bridgeProblem) appendChatLine('system', BRIDGE_PROBLEMS[reason] || BRIDGE_PROBLEMS.other);
        state.bridgeProblem = reason;
        state.bridgeRetryAt = Date.now() + (reason === 'offline' ? 5*60*1000 : 60*1000);
      }
    }

    const reply = localReply(text);
    setTimeout(()=>{
      appendChatLine('him', reply);
      showSpeech(reply.length > 70 ? reply.slice(0, 67) + '…' : reply);
    }, 300 + Math.random() * 400); // small delay so it doesn't feel instant/robotic
  }

  // ---------- hovering a ship ----------
  // drawShips records a hit box per boat each frame, in the canvas's own
  // 320x240 space. The canvas is stretched to fit its container, so pointer
  // coordinates get scaled back into that space before testing.
  const boatTip = document.getElementById('boatTip');
  const frameEl = document.querySelector('.frame');
  let hoveredBoat = null;

  function boatAt(clientX, clientY){
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    const lx = (clientX - r.left) / r.width * W;
    const ly = (clientY - r.top) / r.height * H;
    // Back to front: the nearest boat is drawn last, so it wins an overlap.
    for (let i = state.boatHits.length - 1; i >= 0; i--){
      const h = state.boatHits[i];
      if (lx >= h.x && lx <= h.x + h.w && ly >= h.y && ly <= h.y + h.h) return h;
    }
    return null;
  }

  function describeBoat(b){
    const bits = [];
    if (b.category && b.category !== 'unknown' && b.category !== 'other'){
      bits.push(b.category.charAt(0).toUpperCase() + b.category.slice(1));
    }
    if (typeof b.lengthM === 'number' && b.lengthM > 0) bits.push(b.lengthM + ' m');
    return bits.join(' · ');
  }

  function showBoatTip(hit){
    const b = hit.boat;
    // Vessel names come off a public radio feed — build with textContent so a
    // name can never be interpreted as markup.
    boatTip.textContent = '';
    const name = document.createElement('span');
    name.className = 'bt-name';
    name.textContent = b.name || 'Unknown vessel';
    boatTip.appendChild(name);

    const lines = [];
    const desc = describeBoat(b);
    if (desc) lines.push(desc);
    if (typeof b.distanceKm === 'number'){
      lines.push(b.distanceKm + ' km away, bearing ' + b.bearing + '°');
    }
    if (typeof b.speedKts === 'number'){
      lines.push(b.speedKts > 0.5 ? b.speedKts + ' knots' : 'At anchor / moored');
    }
    if (b.destination) lines.push('Bound for ' + (portName(b.destination) || b.destination));
    for (const text of lines){
      const el = document.createElement('span');
      el.className = 'bt-line';
      el.textContent = text;
      boatTip.appendChild(el);
    }
    if (b.example){
      const el = document.createElement('span');
      el.className = 'bt-line bt-note';
      el.textContent = 'Example only — no live boat data';
      boatTip.appendChild(el);
    }

    const r = canvas.getBoundingClientRect();
    const fr = frameEl.getBoundingClientRect();
    const sx = r.width / W, sy = r.height / H;
    boatTip.style.left = ((hit.x + hit.w/2) * sx + (r.left - fr.left)) + 'px';
    boatTip.style.top  = (hit.y * sy + (r.top - fr.top) - 6) + 'px';
    boatTip.classList.add('show');
  }

  function hideBoatTip(){
    boatTip.classList.remove('show');
    canvas.classList.remove('boat-hover');
    hoveredBoat = null;
  }

  // ---------- places: hover to see what's what, click to send him ----------
  const PLACE_NAMES = { home: 'Home', bookstore: 'The bookshop', cafe: 'The café', work: 'Work', outside: 'The promenade', beach: 'The beach' };

  function canvasPoint(e){
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
  }

  function placeAt(lx, ly){
    for (const r of ROOMS) if (pointInPoly(lx, ly, r.silhouette)) return r.id;
    if (ly >= SKY_LINE && ly < rowY(PROM_EDGE)) return 'outside';
    if (ly >= rowY(PROM_EDGE) && ly < waterlineY()) return 'beach';
    return null;
  }

  function showPlaceTip(place, lx, ly){
    boatTip.textContent = '';
    const name = document.createElement('span');
    name.className = 'bt-name';
    name.textContent = PLACE_NAMES[place];
    const line = document.createElement('span');
    line.className = 'bt-line';
    line.textContent = (place === state.location && !state.walking) ? "He's here" : 'Click to send him here';
    boatTip.append(name, line);
    const r = canvas.getBoundingClientRect(), fr = frameEl.getBoundingClientRect();
    boatTip.style.left = (lx / W * r.width + (r.left - fr.left)) + 'px';
    boatTip.style.top  = ((ly - 8) / H * r.height + (r.top - fr.top)) + 'px';
    boatTip.classList.add('show');
  }

  canvas.addEventListener('mousemove', (e) => {
    const hit = boatAt(e.clientX, e.clientY);
    if (hit){
      canvas.classList.add('boat-hover');
      hoveredBoat = hit.boat;            // repositioned every move, so it tracks a drifting boat
      showBoatTip(hit);
      return;
    }
    const [lx, ly] = canvasPoint(e);
    const place = placeAt(lx, ly);
    if (!place){ hideBoatTip(); return; }
    canvas.classList.add('boat-hover');
    showPlaceTip(place, lx, ly);
  });
  canvas.addEventListener('mouseleave', hideBoatTip);
  // Click a ship for its details (tap on touch screens), or a place to send him there.
  canvas.addEventListener('click', (e) => {
    const hit = boatAt(e.clientX, e.clientY);
    if (hit){ showBoatTip(hit); return; }
    const [lx, ly] = canvasPoint(e);
    const place = placeAt(lx, ly);
    hideBoatTip();
    if (place && place !== state.location) goTo(place);
  });

  document.getElementById('sendBtn').addEventListener('click', sendChat);
  document.getElementById('chatInput').addEventListener('keydown', (e)=>{
    if (e.key === 'Enter') sendChat();
  });

  fetchWeather();
  updateStatusUI();
  setTimeout(()=> showSpeech(pickSpeech()), 1500);
})();
</script>
</body>
</html>

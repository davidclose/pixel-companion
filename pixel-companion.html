<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Companion — Whitley Bay</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14202b;
    --panel: #1c2f3d;
    --edge: #0d1a22;
    --cream: #f2e9dc;
    --amber: #f4a259;
    --coral: #e07a5f;
    --sage: #8bab7f;
    --slate: #5b7c99;
    --muted: #7d93a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 20%, #1e3242, #0c151c 75%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono', monospace;
    color: var(--cream);
    padding: 24px;
  }
  .app{
    width: 100%;
    max-width: 560px;
  }
  .title{
    font-family:'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--amber);
    letter-spacing: 1px;
    margin: 0 0 4px 2px;
  }
  .subtitle{
    font-size: 11px;
    color: var(--muted);
    margin: 0 0 14px 2px;
  }
  .frame{
    background: var(--panel);
    border: 3px solid var(--edge);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
    position: relative;
  }
  canvas{
    width: 100%;
    aspect-ratio: 4 / 3;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    display: block;
    border-radius: 4px;
    background: #000;
  }
  .speech{
    position:absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    max-width: 70%;
    background: var(--cream);
    color: #1c2f3d;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 10px;
    border-radius: 6px;
    border: 2px solid var(--edge);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events:none;
  }
  .speech::after{
    content:"";
    position:absolute;
    bottom:-8px; left: 18px;
    border-width: 8px 6px 0 6px;
    border-style: solid;
    border-color: var(--cream) transparent transparent transparent;
  }
  .speech.show{ opacity:1; transform: translateY(0); }

  .status{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--edge);
    border-radius: 8px;
    font-size: 12px;
  }
  .status .left{ display:flex; align-items:center; gap:10px; }
  .weather-icon{ font-size: 20px; line-height:1; }
  .loc-pill{
    font-family:'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--sage);
    background: rgba(139,171,127,0.12);
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid rgba(139,171,127,0.3);
    white-space: nowrap;
  }
  .meta{ color: var(--muted); font-size: 11px; text-align:right; }
  .row{ display:flex; gap:10px; margin-top:10px; }
  button{
    flex:1;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: 12px;
    background: var(--slate);
    color: var(--cream);
    border: none;
    padding: 9px 10px;
    border-radius: 6px;
    cursor:pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  button:hover{ background: var(--coral); }
  button:active{ transform: scale(0.97); }
  .foot{
    margin-top: 10px;
    font-size: 10px;
    color: var(--muted);
    text-align:center;
  }
  .chatlog{
    margin-top: 10px;
    max-height: 110px;
    overflow-y: auto;
    background: var(--edge);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chatlog:empty{ display:none; }
  .chatline{ line-height: 1.35; }
  .chatline .who{
    font-family:'Press Start 2P', monospace;
    font-size: 8px;
    margin-right: 6px;
  }
  .chatline.you .who{ color: var(--slate); }
  .chatline.him .who{ color: var(--amber); }
  .chatline.system{ color: var(--muted); font-style: italic; }
  .chatrow{ display:flex; gap:8px; margin-top:10px; }
  .chatrow input[type="text"]{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size: 12px;
    background: var(--edge);
    color: var(--cream);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 9px 10px;
  }
  .chatrow input::placeholder{ color: var(--muted); }
  .chatrow button{ flex: 0 0 auto; padding: 9px 14px; }
</style>
</head>
<body>
<div class="app">
  <p class="title">PIXEL COMPANION</p>
  <p class="subtitle">Living quietly in Whitley Bay, weather and all</p>

  <div class="frame">
    <canvas id="scene" width="320" height="240"></canvas>
    <div class="speech" id="speech"></div>
  </div>

  <div class="status">
    <div class="left">
      <span class="weather-icon" id="weatherIcon">🌤️</span>
      <div>
        <div id="weatherText" style="font-weight:700;">Loading weather…</div>
        <div class="meta" id="timeText">—</div>
      </div>
    </div>
    <div class="loc-pill" id="locPill">HOME</div>
  </div>

  <div class="row">
    <button id="nudgeBtn">Nudge him</button>
    <button id="refreshBtn">Refresh weather</button>
  </div>

  <div class="chatlog" id="chatLog"></div>
  <div class="chatrow">
    <input type="text" id="chatInput" placeholder="Say something to him…" maxlength="300">
    <button id="sendBtn">Send</button>
  </div>

  <p class="foot">Weather from Open-Meteo · updates every 30 min · Whitley Bay, UK</p>
</div>

<script>
(function(){
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  // Native 320x240 logical space — no scale transform. Every draw call below
  // works in these coordinates directly, which is what gives the art its
  // detail (twice the addressable resolution per axis vs the old 160x120).
  const W = 320, H = 240;

  function shade(hex, amt){
    const c = hex.replace('#','');
    let r = parseInt(c.substring(0,2),16);
    let g = parseInt(c.substring(2,4),16);
    let b = parseInt(c.substring(4,6),16);
    r = Math.max(0,Math.min(255, Math.round(r + 255*amt)));
    g = Math.max(0,Math.min(255, Math.round(g + 255*amt)));
    b = Math.max(0,Math.min(255, Math.round(b + 255*amt)));
    return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  const PAL = {
    nightSky1: '#0d1826', nightSky2: '#1c2f47',
    daySky1: '#8fd3f4', daySky2: '#c9ecf7',
    cloud: '#f4ecda',
    sun: '#f6d365',
    ground: '#5c8a4f', groundDark: '#456b3c', groundLight: '#6f9e5f', groundShade: '#3d5c33',
    path: '#d9c194', pathEdge: '#c2a877',
    houseWall: '#d9895e', houseRoof: '#8a3f30',
    cafeWall: '#96654a', cafeRoof: '#3e2723', cafeSign: '#e8b93b',
    workWall: '#7a8f9e', workRoof: '#3a4750',
    bookWallExt: '#8a7a58', bookRoofExt: '#4a3628', bookSign: '#7c5a9e',
    doorBrown: '#3b2417', windowGlass: '#bcd8e8', lampGlow: '#f4a259',
    interiorWarm: '#3a2a2a', interiorCafe: '#3d2b22', interiorWork: '#2a3238',
    bookWall: '#4a3628',
    floorHome: '#241a16', floorCafe: '#20140e', floorWork: '#1a2024', floorBook: '#2e2018',
    skin: '#e6b285', hair: '#3f2c1e', blush: '#e0836a',
    shirt: '#8bab7f', shirt2: '#e07a5f', pants: '#39516f', shoe: '#241d18',
    dragonGreen: '#6c9a5a', dragonBelly: '#dccb9e',
    woodLight: '#c9b48a', woodMid: '#8a6a48', woodDark: '#5c4030',
    rugRed: '#a84a3e', rugCream: '#d8c49a',
    flowerRed: '#d9636b', flowerYellow: '#e8c25a', flowerWhite: '#f2ece0', leafGreen: '#5c8a4a',
    smoke: 'rgba(220,220,220,0.45)',
    rain: '#a7c7d9', snow: '#ffffff', fog: 'rgba(212,222,228,0.5)',
    star: '#f2e9dc', outline: '#241c16', ink: '#241c16', mouth: '#8a4c3a'
  };

  function rect(x,y,w,h,color){ ctx.fillStyle=color; ctx.fillRect(x,y,w,h); }

  // beveled fill: light top/left edge, dark bottom/right edge — gives flat blocks a rendered feel
  function bevel(x,y,w,h,base,edge){
    edge = edge || 2;
    rect(x,y,w,h,base);
    rect(x,y,w,edge, shade(base,0.16));
    rect(x,y,edge,h, shade(base,0.16));
    rect(x,y+h-edge,w,edge, shade(base,-0.22));
    rect(x+w-edge,y,edge,h, shade(base,-0.22));
  }

  // outlined + beveled block — the core "chunky pixel" building block used everywhere
  function block(x,y,w,h,base,edge){
    rect(x-2,y-2,w+4,h+4, PAL.outline);
    bevel(x,y,w,h,base,edge||2);
  }

  // rounded, shaded blob for organic shapes (sun, foliage, heads)
  function blob(cx,cy,r,base,outline){
    if (outline !== false){
      ctx.fillStyle = PAL.outline;
      ctx.beginPath(); ctx.arc(cx,cy,r+2,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = shade(base,0.18);
    ctx.beginPath(); ctx.arc(cx-r*0.32,cy-r*0.32,r*0.42,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = shade(base,-0.18);
    ctx.beginPath(); ctx.arc(cx+r*0.35,cy+r*0.4,r*0.38,0,Math.PI*2); ctx.fill();
  }

  // scattered 2x2 speckles over a region, seeded so it's stable frame-to-frame
  function speckle(x,y,w,h,color,density,seed){
    ctx.fillStyle = color;
    const n = Math.floor((w*h)*density);
    for(let i=0;i<n;i++){
      const sx = x + ((i*37 + seed*13) % w);
      const sy = y + ((i*23 + seed*7) % h);
      ctx.fillRect(sx,sy,2,2);
    }
  }

  function flower(x,y,color){
    rect(x,y,2,2,color); rect(x-2,y+2,2,2,color); rect(x+2,y+2,2,2,color); rect(x,y+4,2,2,color);
    rect(x,y+6,2,4,PAL.leafGreen);
  }

  // ---------- state ----------
  const state = {
    weather: { code: 3, temp: 12, isDay: 1, ok: false },
    location: 'home',       // home | outside | cafe | work | bookstore
    transitioning: false,
    animFrame: 0,
    speechTimer: 0,
    tick: 0,
  };

  const LOCATIONS = ['home','outside','cafe','work','bookstore'];

  function mapWeather(code){
    if ([71,73,75,77,85,86].includes(code)) return 'snowy';
    if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'rainy';
    if ([45,48].includes(code)) return 'foggy';
    if ([2,3].includes(code)) return 'cloudy';
    return 'sunny'; // 0,1
  }

  function weatherLabel(w){
    return {sunny:'Sunny', cloudy:'Cloudy', foggy:'Foggy', rainy:'Rainy', snowy:'Snowy'}[w] || 'Clear';
  }
  function weatherIcon(w, isDay){
    if (w==='sunny') return isDay ? '☀️' : '🌙';
    if (w==='cloudy') return isDay ? '⛅' : '☁️';
    if (w==='foggy') return '🌫️';
    if (w==='rainy') return '🌧️';
    if (w==='snowy') return '❄️';
    return '🌤️';
  }

  // ---------- weather fetch ----------
  async function fetchWeather(){
    document.getElementById('weatherText').textContent = 'Checking weather…';
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.0393&longitude=-1.4472&current_weather=true&timezone=Europe/London';
    try{
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const cw = data.current_weather;
      if (!cw) throw new Error('No current_weather in response');
      state.weather = { code: cw.weathercode, temp: Math.round(cw.temperature), isDay: cw.is_day, ok: true };
      state.weather.errorMsg = null;
      updateStatusUI();
      maybeRelocate(true);
    }catch(e){
      console.error('Weather fetch failed:', e);
      state.weather.ok = false;
      state.weather.errorMsg = e.message || String(e);
      updateStatusUI();
    }
  }

  function updateStatusUI(){
    const w = mapWeather(state.weather.code);
    document.getElementById('weatherIcon').textContent = weatherIcon(w, state.weather.isDay);
    document.getElementById('weatherText').textContent = state.weather.ok
      ? `${weatherLabel(w)}, ${state.weather.temp}°C`
      : `Offline (${state.weather.errorMsg || 'unknown error'}) — assuming cloudy`;
    document.getElementById('timeText').textContent = state.weather.isDay ? 'Daytime in Whitley Bay' : 'Night in Whitley Bay';
    document.getElementById('locPill').textContent = state.location.toUpperCase();
  }

  // ---------- behavior ----------
  const SPEECH = {
    home: ['Cosy in here.', "The lizard's asleep already.", "Kettle's on."],
    outside: ['Bit of fresh air.', "Sea's loud today.", 'Nice out, actually.'],
    cafe: ['One flat white, please.', 'Good spot to sit.', "This chair's comfy."],
    work: ['Just tidying a few things up.', 'Nearly done for today.', 'Focus mode.'],
    bookstore: ["Just browsing, honestly.", "Found something good.", "Quiet in here today.", "Smells like old paper in here."],
    rainy: ["Glad I'm not out in that.", 'Listen to that rain.'],
    snowy: ["It's properly coming down.", 'Might build something small.'],
    foggy: ['Can barely see the front gate.'],
    sunny: ['Lovely bit of sun.'],
  };

  function pickSpeech(){
    const w = mapWeather(state.weather.code);
    const pool = [...(SPEECH[state.location]||[]), ...(SPEECH[w]||[])];
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function showSpeech(text){
    const el = document.getElementById('speech');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(state.speechTimer);
    state.speechTimer = setTimeout(()=> el.classList.remove('show'), 4200);
  }

  function preferredLocations(){
    const w = mapWeather(state.weather.code);
    if (!state.weather.isDay) return ['home'];
    if (w === 'rainy' || w === 'snowy') return ['home','cafe','bookstore','home','bookstore'];
    if (w === 'foggy') return ['home','cafe','bookstore'];
    if (w === 'sunny') return ['outside','cafe','work','outside'];
    return ['outside','work','cafe','bookstore','home']; // cloudy
  }

  function maybeRelocate(force){
    if (state.transitioning) return;
    if (!force && Math.random() < 0.45) return; // sometimes he just stays put
    const pool = preferredLocations();
    let next = pool[Math.floor(Math.random()*pool.length)];
    if (next === state.location && !force) return;
    if (next === state.location) return;
    goTo(next);
  }

  function goTo(next){
    state.transitioning = true;
    document.getElementById('locPill').textContent = 'WALKING…';
    setTimeout(()=>{
      state.location = next;
      state.transitioning = false;
      updateStatusUI();
      showSpeech(pickSpeech());
    }, 2600);
  }

  // ---------- drawing helpers ----------
  function skyGradient(x,y,w,h,isDay){
    const g = ctx.createLinearGradient(0,y,0,y+h);
    if (!isDay){ g.addColorStop(0, PAL.nightSky1); g.addColorStop(1, PAL.nightSky2); }
    else { g.addColorStop(0, PAL.daySky1); g.addColorStop(1, PAL.daySky2); }
    ctx.fillStyle = g; ctx.fillRect(x,y,w,h);
  }

  function drawStars(t){
    for(let i=0;i<28;i++){
      const sx = (i*61 + 23) % W;
      const sy = (i*37 + 9) % 110;
      if ((i + Math.floor(t/6)) % 5 === 0) continue;
      rect(sx, sy, 2, 2, PAL.star);
    }
  }

  function drawSun(t){
    blob(256, 44, 20, PAL.sun);
  }

  function drawClouds(t, dense){
    const offsets = dense ? [0, 80, 180] : [20, 200];
    offsets.forEach((o,i)=>{
      const x = ((t*0.3 + o) % (W+80)) - 40;
      const y = 28 + i*20;
      blob(x, y, 10, PAL.cloud, false);
      blob(x+16, y-4, 8, PAL.cloud, false);
      blob(x-14, y+4, 9, PAL.cloud, false);
    });
  }

  function drawRain(t){
    ctx.strokeStyle = PAL.rain; ctx.lineWidth = 2;
    for(let i=0;i<40;i++){
      const x = (i*23 + (t*8)%320) % W;
      const y = (i*29 + (t*12)) % H;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-4,y+10); ctx.stroke();
    }
  }

  function drawSnow(t){
    for(let i=0;i<32;i++){
      const x = (i*37 + Math.sin((t+i)/8)*10 + 320) % W;
      const y = (i*17 + t*2) % H;
      rect(x,y,2,2,PAL.snow);
    }
  }

  function drawFogOverlay(){
    rect(0,0,W,H,PAL.fog);
  }

  function drawTriRoof(x,y,w,color){
    // dark outline silhouette first
    ctx.fillStyle = PAL.outline;
    ctx.beginPath();
    ctx.moveTo(x-8,y+3); ctx.lineTo(x+w/2,y-26); ctx.lineTo(x+w+8,y+3);
    ctx.closePath(); ctx.fill();
    // roof face
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x-4,y); ctx.lineTo(x+w/2,y-22); ctx.lineTo(x+w+4,y);
    ctx.closePath(); ctx.fill();
    // sunlit slope (left half, lighter)
    ctx.fillStyle = shade(color,0.18);
    ctx.beginPath();
    ctx.moveTo(x-4,y); ctx.lineTo(x+w/2,y-22); ctx.lineTo(x+w/2-6,y);
    ctx.closePath(); ctx.fill();
  }

  function smallTree(x, baseY, r){
    rect(x, baseY-18, 5, 18, '#4a3630');
    blob(x+2, baseY-24, r, PAL.groundDark);
    blob(x, baseY-28, r, '#5c8a4f');
  }

  // ---- outside ----
  // Four buildings share one row at 320 wide. The spacing is hand-tuned so the
  // roof overhangs (drawTriRoof spans x-8 .. x+w+8) never collide, and the path
  // sits exactly in the gap between the bookstore and cafe roofs.
  function drawOutside(t, w, isDay){
    skyGradient(0,0,W,144,isDay);
    if (isDay){
      if (w==='sunny') drawSun(t);
      if (w==='cloudy' || w==='rainy' || w==='snowy' || w==='foggy') drawClouds(t, w!=='cloudy');
      // distant hills for depth
      ctx.fillStyle = 'rgba(92,138,79,0.5)';
      ctx.beginPath(); ctx.arc(40,144,44,Math.PI,0); ctx.fill();
      ctx.beginPath(); ctx.arc(300,144,52,Math.PI,0); ctx.fill();
    } else {
      drawStars(t);
    }

    // ground with grass texture
    rect(0,144,W,H-144, PAL.ground);
    rect(0,144,W,6, PAL.groundDark);
    speckle(0,152,W,H-152, PAL.groundLight, 0.004, 1);
    speckle(0,152,W,H-152, PAL.groundShade, 0.003, 5);

    // path
    rect(140,150,40,H-150, PAL.path);
    rect(140,150,4,H-150, PAL.pathEdge);
    rect(176,150,4,H-150, PAL.pathEdge);

    // house (left)
    block(6,96,54,54, PAL.houseWall, 3);
    drawTriRoof(6,96,54, PAL.houseRoof);
    block(12,72,8,16,'#5c4a3a',2); // chimney
    if (isDay && (w==='sunny' || w==='cloudy')){
      ctx.fillStyle = PAL.smoke;
      const puff = (t*0.4)%40;
      ctx.beginPath(); ctx.arc(16, 68-puff*0.5, 4+puff*0.12, 0, Math.PI*2); ctx.fill();
    }
    block(13,104,12,12, isDay ? PAL.windowGlass : PAL.lampGlow, 2);
    block(41,104,12,12, isDay ? PAL.windowGlass : PAL.lampGlow, 2);
    block(26,120,18,30, PAL.doorBrown, 2);
    rect(29,136,3,3,'#e0b13b'); // doorknob
    // window flower box
    rect(11,118,16,5,'#6f5438');
    flower(14,113,PAL.flowerRed); flower(21,113,PAL.flowerYellow);

    // bookstore
    block(80,92,50,58, PAL.bookWallExt, 3);
    drawTriRoof(80,92,50, PAL.bookRoofExt);
    block(84,80,42,10, PAL.bookSign, 2);
    block(86,102,14,14, isDay ? PAL.windowGlass : PAL.lampGlow, 2);
    block(104,120,18,30, PAL.doorBrown, 2);

    // cafe
    block(188,88,54,62, PAL.cafeWall, 3);
    drawTriRoof(188,88,54, PAL.cafeRoof);
    block(194,80,42,10, PAL.cafeSign, 2);
    block(194,100,12,12, isDay ? PAL.windowGlass : PAL.lampGlow, 2);
    block(226,100,12,12, isDay ? PAL.windowGlass : PAL.lampGlow, 2);
    block(206,120,24,30, PAL.doorBrown, 2);

    // work (far right)
    block(258,80,46,70, PAL.workWall, 3);
    rect(256,78,50,6, PAL.workRoof);
    block(264,92,10,10, isDay ? PAL.windowGlass : PAL.lampGlow, 2);
    block(286,92,10,10, isDay ? PAL.windowGlass : PAL.lampGlow, 2);
    block(270,124,22,26, PAL.doorBrown, 2);

    // low fence on the grass in front of the house
    rect(6,152,54,3,'#6f5438');
    for(let i=0;i<5;i++) rect(8+i*12,152,4,12,'#6f5438');

    // foreground trees, sitting on the grass in the gaps between buildings
    smallTree(64,168,11);
    smallTree(248,168,11);

    // cafe's outdoor table + umbrella, set against the cafe front
    rect(216,154,4,30,'#8a5a44');                 // pole
    block(204,182,28,6,'#5c3a26',2);              // table top

  // floor-to-ceiling shelving unit packed with coloured spines
  function bookshelfWall(x,y,w,h,rows,colorSets){
    block(x,y,w,h, PAL.woodDark, 2);
    const rowH = h/rows;
    for(let row=0; row<rows; row++){
      const ry = y + row*rowH + 4;
      rect(x+4, ry, w-8, rowH-6, '#1a120c'); // shelf recess
      const colors = colorSets[row%colorSets.length];
      const spineW = 4, gap = 2;
      const n = Math.floor((w-8)/(spineW+gap));
      for(let i=0;i<n;i++){
        rect(x+6+i*(spineW+gap), ry+2, spineW, rowH-10, colors[i%colors.length]);
      }
      rect(x, y+row*rowH, w, 2, shade(PAL.woodDark,0.2)); // shelf ledge
    }

  // ---- character ----
  function drawCharacter(x,y,frame,seated,facingLeft){
    ctx.save();
    if (facingLeft){ ctx.translate(x*2,0); ctx.scale(-1,1); x = -x; }
    const bob = seated ? 0 : (frame%2===0 ? 0 : -2);

    // legs
    if (!seated){
      block(x+4,y+28+bob,6,12, PAL.pants,1);
      block(x+14,y+28+bob,6,12, PAL.pants,1);
      block(x+4,y+40+bob,6,4, PAL.shoe,1);
      block(x+14,y+40+bob,6,4, PAL.shoe,1);
    } else {
      block(x+2,y+28,8,8, PAL.pants,1);
      block(x+14,y+28,8,8, PAL.pants,1);
    }
    // body
    block(x+2,y+12+bob,20,16, PAL.shirt,2);
    rect(x+3,y+13+bob,18,4, PAL.shirt2);
    // arms
    block(x-3,y+14+bob,5,12, PAL.skin,1);
    block(x+22,y+14+bob,5,12, PAL.skin,1);
    // head
    blob(x+12, y+2+bob, 13, PAL.skin);
    // hair cap
    ctx.fillStyle = PAL.hair;
    ctx.beginPath();
    ctx.arc(x+12, y+2+bob, 13, Math.PI, Math.PI*2);
    ctx.fill();
    rect(x-1, y-4+bob, 5, 12, PAL.hair);
    rect(x+20, y-4+bob, 5, 12, shade(PAL.hair,-0.15));
    // blush
    rect(x+4,y+6+bob,3,2, PAL.blush);
    rect(x+17,y+6+bob,3,2, PAL.blush);
    // eyes
    rect(x+7,y+3+bob,3,4, PAL.ink);
    rect(x+16,y+3+bob,3,4, PAL.ink);
    // mouth
    rect(x+10,y+9+bob,4,2, PAL.mouth);

    ctx.restore();
  }

  function drawWalker(t){
    const progress = (t % 26) / 26; // 0..1 across transition window
    const x = 12 + progress * (W-48);
    const y = 156;
    const frame = Math.floor(t/2)%2;
    drawCharacter(x,y,frame,false,false);
  }

  // ---------- main render loop ----------
  function render(){
    const t = state.tick;
    const w = mapWeather(state.weather.code);
    const isDay = !!state.weather.isDay;

    if (state.transitioning){
      drawOutside(t, w, isDay);
      drawWalker(t);
    } else if (state.location === 'home'){
      drawHome(t,w,isDay);
      drawCharacter(96, 168, Math.floor(t/3)%2, false, false);
    } else if (state.location === 'cafe'){
      drawCafe(t,w,isDay);
      drawCharacter(56, 156, 0, true, false);
    } else if (state.location === 'work'){
      drawWork(t,w,isDay);
      drawCharacter(116, 152, 0, true, false);
    } else if (state.location === 'bookstore'){
      drawBookstore(t,w,isDay);
      drawCharacter(148, 164, Math.floor(t/4)%2, false, false);
    } else {
      drawOutside(t,w,isDay);
      // character is 27 wide drawn from x-3, so x=148 centres him on the 140..180 path
      drawCharacter(148 + Math.sin(t/10)*6, 156, Math.floor(t/3)%2, false, false);
    }

    state.tick += 1;
  }

  setInterval(render, 180);
  setInterval(()=> maybeRelocate(false), 45000);
  setInterval(fetchWeather, 30*60*1000);

  document.getElementById('nudgeBtn').addEventListener('click', ()=>{
    if (state.transitioning) return;
    const pool = LOCATIONS.filter(l => l !== state.location);
    goTo(pool[Math.floor(Math.random()*pool.length)]);

  // ---------- chat: local Claude Code bridge, with an offline fallback ----------
  const CHAT_REPLIES = [
    { keys: ['hi','hey','hello','morning','evening','alright'], lines: ["Oh, hey.", "Hiya.", "Alright?", "Hello there."] },
    { keys: ['how are you','you ok','you alright','how you doing','how\'s it going'],
      lines: ["Not bad, ta. Just pottering about.", "Can't complain, apart from maybe the weather.", "Doing alright, thanks. You?"] },
    { keys: ['lizard','dragon','beardie','pet'],
      lines: ["He's just sat there judging me, as usual.", "The lizard hasn't said much today either.", "He only really cares about heat lamps and crickets.", "Still my favourite housemate, even if he never talks back."] },
    { keys: ['weather','rain','raining','snow','snowing','sun','sunny','fog','foggy','cold','hot'],
      lines: null }, // handled specially below (uses live weather)
    { keys: ['work','job','busy'],
      lines: ["Trying to get through it, honestly.", "Nearly done for today, I think.", "Work's work. Nothing exciting to report."] },
    { keys: ['coffee','cafe','tea','flat white'],
      lines: ["Fancy a coffee run?", "This place does a decent flat white, not gonna lie.", "I could go for a cuppa, actually."] },
    { keys: ['book','books','bookstore','bookshop','reading','read '],
      lines: ["Picked up something new the other day.", "Could happily lose an afternoon in there.", "Bit of a pile building up on my table, if I'm honest."] },
    { keys: ['thanks','thank you','cheers','ta'],
      lines: ["No bother.", "Anytime.", "Course."] },
    { keys: ['bye','see you','later','night','goodnight'],
      lines: ["See you in a bit.", "Catch you later.", "Night, then."] },
    { keys: ['love','nice','great','cool','awesome','good job','well done'],
      lines: ["Aw, cheers.", "Stop it, you'll make me blush.", "That's kind of you to say."] },
    { keys: ['who are you','what are you','tell me about yourself'],
      lines: ["Just someone living quietly round here, really.", "Not much to tell — home, cafe, work, repeat.", "Ask the lizard, he's known me longer."] },
    { keys: ['bored','tired','sleepy','knackered'],
      lines: ["Same, honestly.", "Might just sit down for a bit.", "Today's been a lot, hasn't it."] },
  ];

  function appendChatLine(who, text){
    const log = document.getElementById('chatLog');
    const line = document.createElement('div');
    line.className = 'chatline ' + who;
    const label = who === 'you' ? 'YOU' : 'HIM';
    line.innerHTML = `<span class="who">${label}</span>${text.replace(/</g,'&lt;')}`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function localReply(text){
    const lower = text.toLowerCase();
    const w = mapWeather(state.weather.code);

    for (const group of CHAT_REPLIES){
      if (!group.keys.some(k => lower.includes(k))) continue;
      if (group.lines === null){
        // weather-related question — answer with the actual current weather
        const wLines = {
          sunny: "It's lovely and sunny out, actually.",
          cloudy: "Bit grey and cloudy today.",
          foggy: "Proper foggy — can barely see the front gate.",
          rainy: "Chucking it down, if you hadn't noticed.",
          snowy: "It's snowing! Might build something small later.",
        };
        return wLines[w] || "Not sure, to be honest — hasn't changed much today.";
      }
      return group.lines[Math.floor(Math.random() * group.lines.length)];
    }
    // no keyword match — fall back to the existing location/weather speech pool
    return pickSpeech();
  }

  const BRIDGE_URL = '/chat'; // relative: same-origin once served by companion-server.js
  state.bridgeAvailable = null; // null = untested, true/false once known

  async function bridgeReply(text){
    const w = mapWeather(state.weather.code);
    const controller = new AbortController();
    // must exceed companion-server.js's own timeout (45s for search-triggered
    // requests) — otherwise the browser gives up before the server does and
    // silently falls back to offline replies even though the server would
    // have succeeded given a bit longer.
    const timer = setTimeout(()=> controller.abort(), 50000);
    try{
      const res = await fetch(BRIDGE_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          message: text,
          weather: weatherLabel(w).toLowerCase(),
          location: state.location,
          isDay: !!state.weather.isDay,
        }),
        signal: controller.signal,
      });
      if (!res.ok){
        const body = await res.json().catch(()=>({}));
        throw new Error(body?.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      return data.reply || null;
    }finally{
      clearTimeout(timer);
    }
  }

  async function sendChat(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    appendChatLine('you', text);

    // Try the local Claude Code chat bridge first (companion-server.js); if it's
    // not running or errors, fall back to the fully offline keyword replies.
    const wasAvailable = state.bridgeAvailable !== false;
    if (wasAvailable){
      try{
        const reply = await bridgeReply(text);
        if (reply){
          state.bridgeAvailable = true;
          appendChatLine('him', reply);
          showSpeech(reply.length > 70 ? reply.slice(0, 67) + '…' : reply);
          return;
        }
      }catch(e){
        if (wasAvailable){
          appendChatLine('system', "Couldn't reach the local chat bridge — using offline replies. (Run `node companion-server.js` for real AI replies.)");
        }
        state.bridgeAvailable = false;
      }
    }

    const reply = localReply(text);
    setTimeout(()=>{
      appendChatLine('him', reply);
      showSpeech(reply.length > 70 ? reply.slice(0, 67) + '…' : reply);
    }, 300 + Math.random() * 400); // small delay so it doesn't feel instant/robotic
  }

  document.getElementById('sendBtn').addEventListener('click', sendChat);
  document.getElementById('chatInput').addEventListener('keydown', (e)=>{
    if (e.key === 'Enter') sendChat();
  });

  fetchWeather();
  updateStatusUI();
  setTimeout(()=> showSpeech(pickSpeech()), 1500);
})();
